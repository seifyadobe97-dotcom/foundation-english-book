name: Render Foundation English Voice Library

on:
  workflow_dispatch:
    inputs:
      letter:
        description: 'One letter (A–Z); generates its letter name, words, and sentences'
        required: true
        default: 'A'
        type: string

permissions:
  contents: write

concurrency:
  group: foundation-voice-${{ github.event.inputs.letter }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout static-book repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate generator code
        run: node --check tools/audio-library.mjs
      - name: Render and verify one-letter batch
        env:
          LETTER: ${{ github.event.inputs.letter }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          [[ "$LETTER" =~ ^[A-Za-z]$ ]] || { echo "Enter exactly one letter A–Z"; exit 1; }
          node tools/audio-library.mjs --generate --letter "$LETTER"
          node tools/audio-library.mjs --verify --letter "$LETTER"
      - name: Publish verified assets and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/files audio/voice-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Record verified US male voice batch"
            git push origin HEAD:main
          fi
