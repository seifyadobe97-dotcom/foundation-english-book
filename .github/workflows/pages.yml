name: Test and deploy Foundation English to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: foundation-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Release quality gate
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout static book
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate structure, answers, audio mappings and navigation
        run: npm run test:static
      - name: Install pinned browser-test dependency
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Install Chromium for actual-browser tests
        run: npx playwright install chromium
      - name: Test Foundation English book on desktop and mobile
        run: node tests/browser-smoke.mjs

  step_quality:
    name: STEP Pilot quality gate
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout STEP pilot
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check STEP student, admin and secure question flows
        run: node scripts/test-step-portals.mjs
      - name: Verify Writing Analysis taxonomy, protected historical progress and safe navigation
        run: node tests/writing-analysis-taxonomy.mjs
      - name: Validate Writing private bank Studio and student release gates
        run: node tests/writing-private-bank-release-gates.mjs
      - name: Fast STEP source and JavaScript checks
        run: node tests/step-v2-source-check.mjs
      - name: Install browser-test dependencies
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Test redesigned Present Simple on desktop and mobile
        run: node tests/present-simple-v2.mjs
      - name: Test Subject–Verb Agreement on desktop and mobile
        run: node tests/subject-verb-agreement.mjs
      - name: Test Present Continuous on desktop and mobile (synthetic questions only)
        run: node tests/present-continuous.mjs
      - name: Test generic Past Simple lesson, practice and grading feedback on desktop and mobile
        run: node tests/past-simple.mjs
      - name: Test generic Past Continuous lesson and graded feedback on desktop and mobile
        run: node tests/past-continuous.mjs
      - name: Test Lesson 06 future forms, seven stages and explanation feedback on desktop and mobile
        run: node tests/will-be-going-to.mjs
      - name: Test Lesson 08 Time Clauses on mobile and desktop with synthetic items
        run: node tests/time-clauses.mjs
      - name: Test Lesson 09 Present Perfect on mobile and desktop using synthetic questions
        run: node tests/present-perfect.mjs
      - name: Test Lesson 10 Present Perfect Continuous on desktop and mobile with synthetic items
        run: node tests/present-perfect-continuous.mjs
      - name: Test Lesson 11 Past Perfect grading and responsive teaching with synthetic questions
        run: node tests/past-perfect.mjs
      - name: Test Lesson 15 Modals Fundamentals teaching and graded feedback on desktop/mobile
        run: node tests/modals-fundamentals.mjs
      - name: Test Lesson 17 Passive Voice source-audited teaching and practice on desktop/mobile
        run: node tests/passive-voice-by-tense.mjs
      - name: Test Lesson 19 Pronouns on desktop/mobile with synthetic mock questions only
        run: node tests/pronouns.mjs
      - name: Test Lesson 20 Articles and Countability on desktop/mobile with synthetic items
        run: node tests/articles-countability.mjs
      - name: Test Lesson 21 Too Enough So That synthetic practice on desktop/mobile
        run: node tests/quantity-degree.mjs
      - name: Test Lesson 22 Adjectives and Adverbs synthetic practice on desktop/mobile
        run: node tests/adjectives-adverbs.mjs
      - name: Test Lesson 23 Comparatives and Superlatives synthetic practice on desktop/mobile
        run: node tests/comparatives-superlatives.mjs
      - name: Test Lesson 24 prepositions of time/place synthetic practice on desktop/mobile
        run: node tests/prepositions-time-place.mjs
      - name: Test Lesson 25 Collocations synthetic practice on desktop/mobile
        run: node tests/preposition-collocations.mjs
      - name: Test Lesson 26 Word Formation synthetic teaching stages on desktop/mobile
        run: node tests/word-formation.mjs
      - name: Test Lesson 27 Gerunds synthetic grading on desktop/mobile
        run: node tests/gerunds.mjs
      - name: Test Lesson 28 To-Infinitive synthetic grading on desktop/mobile
        run: node tests/infinitives.mjs
      - name: Test Lesson 29 Bare Infinitives synthetic grading on desktop/mobile
        run: node tests/bare-infinitives.mjs
      - name: Test Lesson 30 Causatives teaching and synthetic practice on desktop/mobile
        run: node tests/causatives.mjs
      - name: Test Lesson 31 Conjunctions and Connectors synthetic grading on desktop/mobile
        run: node tests/conjunctions-connectors.mjs
      - name: Test Lesson 32 Relative Clauses synthetic practice on desktop/mobile
        run: node tests/relative-clauses.mjs
      - name: Test Lesson 33 Zero Conditional synthetic practice on desktop/mobile
        run: node tests/zero-conditional.mjs
      - name: Validate first five full Arabic stage reviews (26 teaching stages)
        run: node tests/lesson-stage-clarity.mjs
      - name: Validate 31 new Arabic stage reviews for Grammar 06 through 10
        run: node tests/lesson-stage-clarity-batch2.mjs
      - name: Validate 31 new Grammar 11–15 beginner stage guides
        run: node tests/lesson-stage-clarity-batch3.mjs
      - name: Validate 35 new Grammar 16–20 beginner stage guides
        run: node tests/lesson-stage-clarity-batch4.mjs
      - name: Validate 25 new Grammar 21–25 beginner stage guides
        run: node tests/lesson-stage-clarity-batch5.mjs
      - name: Validate 21 new Grammar 26–30 beginner stage guides
        run: node tests/lesson-stage-clarity-batch6.mjs
      - name: Validate 19 new Grammar 31–35 beginner stage guides
        run: node tests/lesson-stage-clarity-batch7.mjs
      - name: Validate 20 new Grammar 36–40 beginner stage guides
        run: node tests/lesson-stage-clarity-batch8.mjs
      - name: Validate 20 new Grammar 41–45 beginner stage guides
        run: node tests/lesson-stage-clarity-batch9.mjs
      - name: Validate 35 Writing Analysis stages for beginner clarity
        run: node tests/lesson-stage-clarity-writing.mjs
      - name: Verify 263 beginner stages in real Pages artifact (desktop/mobile)
        run: node tests/lesson-stage-clarity-browser.mjs
      - name: Verify all 53 beginner-friendly Arabic teaching guides
        run: node tests/beginner-arabic-guides.mjs
      - name: Verify shared teaching visual layouts Arabic/LTR on desktop and mobile
        run: node tests/teaching-visual-ltr-regression.mjs
      - name: Test Lesson 34 First Conditional synthetic practice on desktop/mobile
        run: node tests/first-conditional.mjs
      - name: Test Lesson 35 Second Conditional synthetic teaching on desktop/mobile
        run: node tests/second-conditional.mjs
      - name: Test Lesson 36 Third Conditional synthetic teaching on desktop/mobile
        run: node tests/third-conditional.mjs
      - name: Test Lesson 37 Wishes and Unreal synthetic practice on desktop/mobile
        run: node tests/wishes-unreal.mjs
      - name: Test Lesson 38 Reported Speech synthetic practice on desktop/mobile
        run: node tests/reported-speech.mjs
      - name: Test Lesson 39 Indirect Questions source-safe synthetic browser lesson
        run: node tests/indirect-questions.mjs
      - name: Test Lesson 40 Question Tags source-safe responsive practice
        run: node tests/question-tags.mjs
      - name: Test Lesson 41 So and Neither Agreement mobile and desktop practice
        run: node tests/so-neither-agreement.mjs
      - name: Test Lesson 42 Advanced Conditionals synthetic lesson mobile/desktop
        run: node tests/advanced-conditionals.mjs
      - name: Test Lesson 43 Question Formation synthetic grading on desktop/mobile
        run: node tests/question-formation.mjs
      - name: Test Lesson 44 Question Words original-safe browser practice desktop/mobile
        run: node tests/question-words.mjs
      - name: Test Lesson 45 Correct Word Order synthetic practice desktop/mobile
        run: node tests/correct-word-order.mjs
      - name: Test organized admin dashboard and lesson editor links
        run: node tests/admin-navigation.mjs
      - name: Test unified STEP admin course editor on desktop and mobile
        run: node tests/course-studio.mjs
      - name: Test dynamic student dashboard on desktop and mobile
        run: node tests/student-experience.mjs
      - name: Test Writing Analysis published-only dashboard on desktop/mobile
        run: node tests/writing-student-browser.mjs
      - name: Test partial course API failures and safe learner retry on mobile/desktop
        run: node tests/student-dashboard-resilience.mjs
      - name: Test learner path from dashboard through real practice grading and Writing
        run: node tests/student-learning-journey.mjs
      - name: Verify 53-course 263-stage dashboard with progressive loading on mobile and desktop
        run: node tests/student-full-catalog.mjs
      - name: Verify explanation-only STEP stages are ungraded and can continue
        run: node tests/ungraded-teaching-stages.mjs
      - name: Check Arabic recovery on course and stage fetch failures on two widths
        run: node tests/lesson-network-recovery.mjs
      - name: Verify STEP Listening 15 30 45s practice and one-play exam modes on mobile and desktop
        run: node tests/listening-dual-mode.mjs
      - name: Verify public synthetic Listening lab, safe demo link and spoken trial on mobile and desktop
        run: node tests/listening-public-demo.mjs
      - name: Verify two-source Listening student preview and private marking boundary
        run: node tests/listening-source-samples.mjs
      - name: Browser-test two recorded-source previews with local audio and private grading on mobile and desktop
        run: node tests/listening-source-samples-browser.mjs
      - name: Test authenticated Listening direct-audio and official attempt boundary
        run: node tests/listening-live-contract.mjs
      - name: Browser-test authenticated Listening audio and saved scores on desktop and mobile
        run: node tests/listening-live-browser.mjs

  deploy:
    name: Deploy verified static book
    needs: [quality, step_quality]
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build student-safe site (hide paused foundation and internal material)
        run: node scripts/build-step-public-site.mjs "${{ runner.temp }}/step-public"
      - name: Upload student-safe site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/step-public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
