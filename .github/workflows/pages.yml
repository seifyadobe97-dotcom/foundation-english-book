name: Test and deploy Foundation English to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: foundation-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Release quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout static book
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate structure, answers, audio mappings and navigation
        run: npm run test:static
      - name: Install pinned browser-test dependency
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Install Chromium for actual-browser tests
        run: npx playwright install --with-deps chromium
      - name: Test navigation, quizzes and mobile layout in Chromium
        run: npm run test:browser

  deploy:
    name: Deploy verified static book
    needs: quality
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
