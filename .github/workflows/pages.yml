name: Test and deploy Foundation English to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: foundation-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Release quality gate
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout static book
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate structure, answers, audio mappings and navigation
        run: npm run test:static
      - name: Install pinned browser-test dependency
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Install Chromium for actual-browser tests
        run: npx playwright install --with-deps chromium
      - name: Test Foundation English book on desktop and mobile
        run: node tests/browser-smoke.mjs

  step_quality:
    name: STEP Pilot quality gate
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout STEP pilot
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check STEP student, admin and secure question flows
        run: node scripts/test-step-portals.mjs
      - name: Fast STEP source and JavaScript checks
        run: node tests/step-v2-source-check.mjs
      - name: Install browser-test dependencies
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test redesigned Present Simple on desktop and mobile
        run: node tests/present-simple-v2.mjs

  deploy:
    name: Deploy verified static book
    needs: [quality, step_quality]
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
