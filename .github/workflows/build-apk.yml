name: Build Foundation English Android APK

on:
  push:
    branches: [main, android-app-build-2026-10-14]
    paths:
      - 'android/**'
      - 'index.html'
      - 'style.css'
      - 'logo.svg'
      - 'audio/voice-manifest.json'
      - 'audio/files/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout student book source
        uses: actions/checkout@v4
      - name: Verify source book integrity
        run: |
          node --test tests/stability.mjs
          test "$(grep -o 'class="page ' index.html | wc -l)" -eq 45
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform and build tools
        run: |
          echo "Using preinstalled Android SDK: $ANDROID_HOME"
          MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -n "$MANAGER"
          echo "SDK manager: $MANAGER"
          yes | "$MANAGER" --licenses >/dev/null || true
          "$MANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up verified Gradle version
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build installable debug APK
        run: gradle -p android --no-daemon --stacktrace :app:assembleDebug
      - name: Verify the APK bundles all 45 HTML pages and local assets
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/web/index.html'
          unzip -l "$APK" | grep -q 'assets/web/style.css'
          unzip -l "$APK" | grep -q 'assets/web/logo.svg'
          unzip -l "$APK" | grep -q 'assets/web/audio/voice-manifest.json'
          count=$(unzip -p "$APK" assets/web/index.html | grep -o 'class="page ' | wc -l)
          test "$count" -eq 45
          echo "Verified APK with $count pages; APK size: $(du -h "$APK" | cut -f1)"
          sha256sum "$APK"
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Foundation-English-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
