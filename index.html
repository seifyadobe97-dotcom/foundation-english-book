<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#479599">
  <title>Foundation English — Interactive Student Book</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="splash" class="splash"><img src="logo.svg" alt="Institute logo"></div>

  <header class="top">
    <div class="brand">
      <img src="logo.svg" alt="Institute logo">
      <div><b>Foundation English</b><small>Interactive Student Book • Institute Edition</small></div>
    </div>
    <div class="actions">
      <span id="net" class="net">●</span>
      <button id="install" aria-label="Install">＋</button>
      <button id="full" aria-label="Full screen">⛶</button>
      <button id="prev" aria-label="Previous page">◀</button>
      <span id="count" class="count">1 / 1</span>
      <button id="next" aria-label="Next page">▶</button>
    </div>
  </header>

  <main id="book">
    <section class="page cover active" data-page="1">
      <div class="coverTop">FOUNDATION ENGLISH</div>
      <div class="coverMain">
        <div class="k">INTERACTIVE STUDENT BOOK</div>
        <h1>Letters<br><span>A - Z</span></h1>
        <p>Listen. Learn. Practice.</p>
        <div class="coverLetters"><span>A</span><span>M</span><span>Z</span></div>
      </div>
      <div class="coverFoot">
        <b>Student Digital Book</b>
        <img src="logo.svg" alt="Institute logo">
        <span>Interactive Edition</span>
      </div>
    </section>
  </main>

  <div id="help" class="installHelp" hidden>
    <div>
      <b>Install Foundation English</b>
      <p id="helpText"></p>
      <button id="closeHelp">Close</button>
    </div>
  </div>

  <div id="toast" class="toast">Ready</div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
