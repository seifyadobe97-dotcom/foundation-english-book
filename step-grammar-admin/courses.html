<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>إدارة الدروس | STEP with Seify</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#162e3c;--teal:#28796e;--muted:#70838a;--line:#dce6e2}
*{box-sizing:border-box}body{margin:0;background:#f6f8f6;color:#263d43;font:14px/1.9 Cairo,Tahoma,sans-serif}
input,textarea,button{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}
a{text-decoration:none;color:var(--teal)}header{background:#fff;padding:19px max(18px,calc((100vw - 1140px)/2));display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:10px}
.logo{font:800 16px "DM Sans";letter-spacing:.12em;color:var(--navy)}.logo small{font:600 11px Cairo;letter-spacing:0;color:var(--muted);display:block}
main{max-width:1160px;margin:auto;padding:28px 20px 80px}h1{font-size:34px;line-height:1.45;margin:5px 0 8px;color:var(--navy)}h2{font-size:20px;margin:0 0 14px}
.eyebrow{font:800 11px "DM Sans";color:var(--teal);letter-spacing:.12em}.intro{color:var(--muted);margin:0 0 27px}
.grid{display:grid;grid-template-columns:350px minmax(0,1fr);gap:17px;align-items:start}
.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:23px;box-shadow:0 10px 25px #112a1c06}
.course{display:block;text-align:right;width:100%;border:1px solid var(--line);border-radius:11px;padding:13px;background:#fff;margin-top:10px}
.course.active{border-color:var(--teal);background:#f0f8f5}.course strong{display:block;color:var(--navy);font-size:15px}.course small{color:var(--muted)}
.badge{font-size:11px;font-weight:800;background:#e9f5ef;color:#277756;border-radius:50px;padding:4px 10px;display:inline-block}
.badge.draft{background:#fff1d8;color:#986a2d}.badge.archive{background:#f0eded;color:#826e6e}
.field{margin-top:16px}.field label{display:block;font-weight:800;font-size:12px;margin-bottom:6px}
.field input,.field textarea{width:100%;padding:11px 13px;border:1px solid #d6e2de;border-radius:9px;background:#fcfdfc}
.field textarea{min-height:110px;resize:vertical}.ltr{direction:ltr;text-align:left;font-family:"DM Sans",sans-serif}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 16px;border-radius:10px;border:0;background:var(--navy);color:#fff;font-weight:800;min-height:42px;gap:7px}
.btn.alt{background:#fff;color:var(--navy);border:1px solid #cfddd7}.btn.danger{background:#fff4f3;border:1px solid #ecd0d0;color:#9c5050}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #c1a276;outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:23px}
.notice{border:1px solid #f0dfbf;background:#fff9eb;padding:12px 15px;border-radius:10px;margin:17px 0;color:#6e582e}
.error{background:#fff1f0;border-color:#eecfcc;color:#934e4a}
@media(max-width:800px){.grid{grid-template-columns:1fr}.panel{padding:16px}}
.step-brand-image{display:block;width:206px;max-width:100%;height:auto;flex:none}@media(max-width:480px){.step-brand-image{width:158px}}</style><link rel="icon" type="image/svg+xml" href="../step-brand/mark.svg"></head>
<body>
<header><img class="step-brand-image" src="../step-brand/logo.svg" alt="STEP with Seify" width="218" height="51"><a class="btn alt" href="./">لوحة الأدمن</a></header>
<main id="main"><p>جاري تحميل قائمة الدروس…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
<script>
"use strict";
const URL_BASE="https://funltjxavowlnnfibhpl.supabase.co";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1bmx0anhhdm93bG5uZmliaHBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MjYwODQsImV4cCI6MjEwODAwMjA4NH0.bvypJvBORTQ79Wf0yz5mLgKeFylDZtvf74uTvy4DWCg";
const sb=window.supabase.createClient(URL_BASE,KEY);
const root=document.getElementById("main");
const escapeHtml=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const state={courses:[],live:null,role:null,selected:null};
async function api(path,options={}){
 const {data:{session}}=await sb.auth.getSession();if(!session)throw Error("سجّل دخولك للأدمن الأول.");
 const response=await fetch(URL_BASE+"/functions/v1/step-admin"+path,{
  method:options.method||"GET",
  headers:{"Authorization":"Bearer "+session.access_token,"apikey":KEY,"Content-Type":"application/json"},
  body:options.body
 });
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw Error(data.error||"تعذر تنفيذ العملية");
 return data;
}
function failure(e){
 root.innerHTML='<h1>إدارة الدروس</h1><div class="notice error">'+escapeHtml(e?.message||"تعذر فتح الصفحة")+'</div><a class="btn alt" href="./">العودة للوحة الأدمن</a>';
}
async function loadCourses(selectedId=null){
 try{
  const result=await api("/course-drafts");
  state.live=result.existing_course;state.courses=result.courses||[];
  if(selectedId!==null)state.selected=selectedId;
  render();
 }catch(error){failure(error);}
}
function selectCourse(id){state.selected=id;render();}
function render(){
 const canEdit=state.role==="owner";
 const active=state.courses.find(x=>x.id===state.selected)||null;
 const live=state.live||{};
 root.innerHTML='<div class="eyebrow">CURRICULUM MANAGEMENT</div><h1>تنظيم الدروس الجديدة</h1><p class="intro">جهّز قائمة الدروس ووصفها وترتيبها، ثم نبني المحتوى والأسئلة قبل فتحها للطلاب.</p><div class="grid"><section class="panel"><h2>قائمة الدروس</h2><div class="course"><span class="badge">منشور</span><strong>'+escapeHtml(live.title_en||"Present Simple")+'</strong><small>'+escapeHtml(live.title_ar||"المضارع البسيط")+' · '+(live.parts||6)+' أجزاء</small></div>'+
  state.courses.map(x=>'<button type="button" data-course="'+escapeHtml(x.id)+'" class="course '+(state.selected===x.id?'active':'')+'"><span class="badge '+(x.status==="draft"?"draft":"archive")+'">'+(x.status==="draft"?"مسودة":"مؤرشف")+'</span><strong>'+escapeHtml(x.title_ar)+'</strong><small><span class="ltr">'+escapeHtml(x.slug)+'</span> · ترتيب '+x.position+'</small></button>').join("")+
  (canEdit?'<div class="actions"><button id="add-new" class="btn">+ إضافة درس جديد</button></div>':'')+'</section><section class="panel"><h2>'+(active?"تعديل بيانات الدرس":"إنشاء مسودة درس")+'</h2><span class="badge draft">مسودة إعداد · غير متاحة للطلاب</span><form id="course-form"><div class="field"><label for="ar">اسم الدرس بالعربي</label><input id="ar" required maxlength="140" value="'+escapeHtml(active?.title_ar||"")+'"></div><div class="field"><label for="en">اسم الدرس بالإنجليزي</label><input id="en" class="ltr" required maxlength="140" value="'+escapeHtml(active?.title_en||"")+'"></div><div class="field"><label for="slug">الكود الإنجليزي الفريد</label><input id="slug" class="ltr" required maxlength="40" pattern="[a-z][a-z0-9-]{2,39}" placeholder="present-continuous" value="'+escapeHtml(active?.slug||"")+'"></div><div class="field"><label for="position">ترتيب الدرس في المنهج</label><input id="position" class="ltr" type="number" required min="1" max="9999" value="'+(active?.position??2)+'"></div><div class="field"><label for="description">وصف الدرس</label><textarea id="description" maxlength="1500">'+escapeHtml(active?.description||"")+'</textarea></div>'+
   (canEdit?'<div class="actions"><button id="save" class="btn" type="submit">حفظ بيانات المسودة</button>'+(active?'<button id="change-status" class="btn '+(active.status==="draft"?"danger":"alt")+'" type="button">'+(active.status==="draft"?"أرشفة الدرس":"استعادة المسودة")+'</button>':'')+'</div>':'')+
   '</form><div class="notice">هذه الصفحة لإعداد قائمة الدروس فقط. لن يظهر الدرس للطلاب إلا بعد تجهيز شرحه وأسئلته واختباراته وربطه بمحرك التعلم.</div></section></div>';
 document.querySelectorAll("[data-course]").forEach(b=>b.onclick=()=>selectCourse(b.dataset.course));
 if(!canEdit){
  root.querySelectorAll("input,textarea,button[type=submit]").forEach(x=>x.disabled=true);
  return;
 }
 const newBtn=document.getElementById("add-new");if(newBtn)newBtn.onclick=()=>selectCourse(null);
 document.getElementById("course-form").onsubmit=async e=>{
  e.preventDefault();
  const button=document.getElementById("save");button.disabled=true;button.textContent="جاري الحفظ…";
  const data={id:active?.id||null,title_ar:document.getElementById("ar").value.trim(),
   title_en:document.getElementById("en").value.trim(),
   slug:document.getElementById("slug").value.trim().toLowerCase(),
   description:document.getElementById("description").value.trim(),
   position:Number(document.getElementById("position").value)};
  try{
   const result=await api("/course-drafts/save",{method:"POST",body:JSON.stringify(data)});
   await loadCourses(result.course.id);
  }catch(error){alert(error.message);button.disabled=false;button.textContent="حفظ بيانات المسودة";}
 };
 const status=document.getElementById("change-status");
 if(status)status.onclick=async()=>{
  const archive=active.status==="draft";
  if(!confirm((archive?"أرشفة":"استعادة")+" مسودة "+active.title_ar+"؟"))return;
  status.disabled=true;
  try{
   await api("/course-drafts/status",{method:"POST",body:JSON.stringify({id:active.id,archived:archive})});
   await loadCourses(active.id);
  }catch(error){alert(error.message);status.disabled=false;}
 };
}
async function init(){
 try{
  const {data:{session}}=await sb.auth.getSession();
  if(!session)throw Error("ادخل على لوحة الأدمن وسجّل دخولك قبل إدارة الدروس.");
  const info=await api("/me");state.role=info.role;
  await loadCourses();
 }catch(error){failure(error);}
}
init();
</script></body></html>
