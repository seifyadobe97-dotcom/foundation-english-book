<style>
:root{--navy:#162e3c;--ink:#283b44;--muted:#71818a;--bg:#f6f7f5;--line:#dfe7e4;--teal:#25746a;--teal-bg:#e9f5ef;--gold:#c79b61;--red:#ab4b4b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.8 Cairo,Tahoma,sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}a{color:inherit;text-decoration:none}.ltr{font-family:"DM Sans",Arial,sans-serif;direction:ltr;unicode-bidi:isolate;display:inline-block}.shell{max-width:1280px;margin:0 auto;padding:30px clamp(16px,4vw,50px) 75px}
.top{background:#fff;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:19px clamp(16px,4vw,65px);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:13px}.logo{width:43px;height:43px;display:grid;place-items:center;border-radius:12px;background:var(--navy);border:1px solid var(--gold);color:var(--gold);font:800 20px "DM Sans"}.brand-name{font:800 15px/1.2 "DM Sans";letter-spacing:.1em;color:var(--navy)}.brand-sub{font-size:11px;color:var(--muted)}.nav-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.nav-actions a{font-size:13px;color:var(--teal);font-weight:800}
.admin-tabs{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:18px 0 23px}.admin-tab{border:1px solid #d3dfdc;border-radius:11px;background:white;padding:9px 18px;font-weight:800;color:#54716f}.admin-tab.is-active{background:var(--navy);color:white;border-color:var(--navy)}
.question-layout{display:grid;grid-template-columns:minmax(255px,350px) minmax(0,1fr);gap:18px;align-items:start}.question-list{display:grid;gap:8px;max-height:680px;overflow-y:auto;padding:8px}.q-item{width:100%;text-align:right;background:#fff;border:1px solid var(--line);padding:12px;border-radius:10px;color:var(--ink);cursor:pointer}.q-item.active{border-color:var(--teal);background:#eff8f5}.q-item small{display:block;color:var(--muted);font-size:11px}.q-item strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:left}.q-form{padding:22px}.q-form textarea,.q-form input,.q-form select{width:100%;border:1px solid #ccdcd7;border-radius:9px;padding:10px 12px;font:inherit;background:white}.q-form textarea{min-height:90px;resize:vertical;direction:ltr;text-align:left}.q-form select{direction:rtl}.q-form .q-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.q-form label{display:block;font-size:12px;font-weight:800;margin-bottom:4px}.q-form .field{margin-top:14px}.q-actions{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px}.q-item .state{color:#b1803f;direction:rtl;text-align:right}
@media(max-width:850px){.question-layout{grid-template-columns:1fr}.question-list{max-height:240px}}
.btn{border:0;border-radius:10px;padding:11px 19px;min-height:43px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn-main{color:#fff;background:var(--navy)}.btn-main:hover{background:#244b5c}.btn-outline{background:white;border:1px solid #cddbd7;color:var(--navy)}.btn-small{min-height:34px;padding:5px 12px;font-size:12px}.btn-danger{color:#9a4242;background:#fff3f3;border:1px solid #f3d5d5}.btn-good{color:#17694e;background:#e8f5ef;border:1px solid #c4e1d4}
.eyebrow{font:800 11px "DM Sans";color:#bc9163;letter-spacing:.16em;text-transform:uppercase}.page-title{font-size:clamp(26px,3.6vw,38px);line-height:1.4;margin:6px 0 8px}.intro{color:var(--muted);margin:0 0 28px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:25px;box-shadow:0 12px 45px #152f3d08}.auth-layout{display:grid;place-items:center;min-height:60vh}.login{width:min(100%,470px);padding:36px}.login h1{font-size:26px;margin:9px 0}.login p{font-size:14px;color:var(--muted)}.field{margin-top:18px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input{width:100%;border:1px solid #d7e0df;padding:12px 15px;border-radius:9px;background:#fcfcfb;direction:ltr;text-align:left;outline:none}.field input:focus{border-color:var(--teal)}.login .btn-main{width:100%;margin-top:24px}.help{font-size:13px;color:var(--muted);margin-top:18px}.notice{padding:14px 17px;margin:16px 0;border-radius:10px;color:#87572f;background:#fff7e9;border:1px solid #f0dfc5}.notice.error{background:#fff1f1;color:#a44848;border-color:#f1d4d4}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:23px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px}.stat strong{display:block;font:800 clamp(26px,3vw,34px) "DM Sans";color:var(--navy)}.stat span{font-size:13px;color:var(--muted)}
.table-panel{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden}.table-top{padding:21px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.table-top h2{margin:0;font-size:20px}.table-top p{margin:0;color:var(--muted);font-size:13px}.search{display:flex;gap:9px;flex-wrap:wrap}.search input{width:min(300px,75vw);padding:8px 13px;border:1px solid #d3dddb;border-radius:9px;background:#fafcfb;direction:rtl;text-align:right}
.table-scroll{width:100%;overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:right;padding:13px 15px;border-top:1px solid #edf0ee;vertical-align:middle}th{background:#f7f9f8;color:#65777c;font-size:12px;white-space:nowrap}td{font-size:13px}td.name{font-weight:800;color:var(--navy)}.contact{display:block;font-size:12px;color:var(--muted)}.contact a{color:var(--teal);font-weight:700}.tag{font-size:12px;font-weight:800;padding:4px 9px;border-radius:99px;white-space:nowrap;display:inline-block}.tag.active{background:var(--teal-bg);color:#1b7454}.tag.inactive{background:#fff0ef;color:#9e4a47}.progress{width:80px;height:7px;background:#e9efec;border-radius:7px;overflow:hidden;margin-top:4px}.progress div{height:100%;background:var(--teal)}.actions{display:flex;gap:7px;flex-wrap:wrap}.bottom{padding:14px 21px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);gap:10px}.bottom span{font-size:12px;color:var(--muted)}.footer{text-align:center;margin-top:35px;color:#8c9c9d;font:600 11px "DM Sans"}
[hidden]{display:none!important}
@media(max-width:650px){.top{padding:12px 15px}.brand-name{font-size:12px}.brand-sub{font-size:10px}.shell{padding:25px 14px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:13px}.table-top{padding:16px}.login{padding:23px}.nav-actions a{display:none}}

.lesson-edit-heading{font-size:19px;margin:18px 0 8px;padding-bottom:7px;border-bottom:1px solid var(--line);color:var(--navy)}

.lesson-status{display:inline-flex;background:#e9f5ef;color:#1c7653;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:800}

<body>
<header class="top"><div class="brand"><img class="step-brand-image" src="../step-brand/logo.svg" alt="STEP with Seify" width="218" height="51"></div><div class="nav-actions"><a href="../step-grammar-account-preview/" target="_blank" rel="noopener">صفحة الطلاب ↗</a><button id="logout" class="btn btn-outline btn-small" hidden>تسجيل الخروج</button></div></header>
<div id="root"><main class="shell"><p>جاري التحقق من صلاحية الدخول…</p></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
<script>
"use strict";
const SUPABASE_URL="https://funltjxavowlnnfibhpl.supabase.co";
const ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1bmx0anhhdm93bG5uZmliaHBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MjYwODQsImV4cCI6MjEwODAwMjA4NH0.bvypJvBORTQ79Wf0yz5mLgKeFylDZtvf74uTvy4DWCg";
const db=window.supabase.createClient(SUPABASE_URL,ANON_KEY);
const root=document.getElementById("root");
const logoutButton=document.getElementById("logout");
const ui={page:1,search:"",total:0,role:null,rows:[]};
const escapeHtml=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const niceDate=s=>s?new Date(s).toLocaleDateString("ar-SA",{year:"numeric",month:"short",day:"numeric"}):"—";
const digits=s=>String(s||"").replace(/\D/g,"");
function errorMessage(e){return e&&e.message?e.message:"تعذر إكمال العملية"}
async function api(path,opts={}){
 const result=await db.auth.getSession();
 const session=result.data.session;
 if(!session)throw Error("يرجى تسجيل الدخول أولًا");
 const response=await fetch(SUPABASE_URL+"/functions/v1/step-admin"+path,{
  method:opts.method||"GET",headers:{"Content-Type":"application/json","apikey":ANON_KEY,"Authorization":"Bearer "+session.access_token},
  body:opts.body
 });
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw Error(data.error||"تعذر الاتصال بخدمة الأدمن");
 return data;
}
function showLogin(msg=""){
 logoutButton.hidden=true;
 root.innerHTML='<div class="auth-layout shell"><form id="login-form" class="panel login"><div class="eyebrow">SECURE ADMIN ACCESS</div><h1>لوحة إدارة طلاب STEP</h1><p>سجّل دخولك بالحساب اللي مُنحت له صلاحية الأدمن. إنشاء حساب طالب لوحده لا يمنح صلاحيات الإدارة.</p>'+(msg?'<div class="notice error">'+escapeHtml(msg)+'</div>':'')+'<div class="field"><label for="username">اسم المستخدم</label><input id="username" autocomplete="username" required minlength="3" dir="ltr"></div><div class="field"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required minlength="10" dir="ltr"></div><button id="login" class="btn btn-main" type="submit">تسجيل الدخول للوحة</button></form></div>';
 document.getElementById("login-form").onsubmit=async e=>{
  e.preventDefault();const b=document.getElementById("login");b.disabled=true;b.textContent="جاري التحقق…";
  try{
   const username=document.getElementById("username").value.trim().toLowerCase();
   const password=document.getElementById("password").value;
   const r=await fetch(SUPABASE_URL+"/functions/v1/username-login",{
    method:"POST",headers:{"Content-Type":"application/json","apikey":ANON_KEY},
    body:JSON.stringify({username,password})
   });
   const data=await r.json().catch(()=>({}));
   if(!r.ok)throw Error(data.error||"فشل تسجيل الدخول");
   const session=await db.auth.setSession({access_token:data.access_token,refresh_token:data.refresh_token});
   if(session.error)throw session.error;
   await checkAdmin();
  }catch(error){showLogin(errorMessage(error));}
 };
}
const questionState={list:[],sections:[],currentId:null,filter:"all"};
async function checkAdmin(){
 try{
  const info=await api("/me");ui.role=info.role;logoutButton.hidden=false;await loadStudents();
 }catch(error){
  const accessDenied=errorMessage(error).includes("غير مخوّل");
  if(accessDenied){
   root.innerHTML='<main class="shell"><div class="panel" style="max-width:650px;margin:55px auto"><div class="eyebrow">ACCESS RESTRICTED</div><h1>الحساب ده مش أدمن</h1><div class="notice">الحساب شغال كطالب، لكن محتاج تفعيله من إدارة المنصة علشان تفتح لوحة التحكم.</div><p>ممكن تخرج وتسجّل دخول بحساب الأدمن بعد تفعيله.</p><button id="denied-logout" class="btn btn-outline">تسجيل الخروج</button></div></main>';
   logoutButton.hidden=false;document.getElementById("denied-logout").onclick=logout;
  }else showLogin(errorMessage(error));
 }
}
function rowHtml(s){
 const pct=Math.min(100,Math.max(0,Number(s.parts_passed)*100/6));
 const label=s.active?"مفعّل":"موقوف";
 const phone=String(s.phone||"");
 const wa=digits(phone);
 const phoneHtml=wa.length>=8&&wa.length<=15?'<a href="https://wa.me/'+wa+'" target="_blank" rel="noopener noreferrer" class="ltr">'+escapeHtml(phone)+' ↗</a>':'<span class="ltr">'+escapeHtml(phone||"—")+'</span>';
 const btn=ui.role==="owner"?(s.active?'<button class="btn btn-danger btn-small" data-status="0" data-id="'+escapeHtml(s.user_id)+'">إيقاف</button>':'<button class="btn btn-good btn-small" data-status="1" data-id="'+escapeHtml(s.user_id)+'">تفعيل</button>'):"—";
 return '<tr><td class="name"><span class="ltr">'+escapeHtml(s.username)+'</span></td><td><span class="contact ltr">'+escapeHtml(s.email||"—")+'</span></td><td>'+phoneHtml+'</td><td><strong class="ltr">'+Number(s.parts_passed)+'/6</strong><div class="progress"><div style="width:'+pct+'%"></div></div></td><td>'+(s.exam_best==null?"—":'<strong class="ltr">'+Number(s.exam_best)+'%</strong>')+'</td><td><span class="tag '+(s.active?"active":"inactive")+'">'+label+'</span></td><td>'+niceDate(s.last_activity||s.created_at)+'</td><td><div class="actions"><a class="btn btn-outline btn-small" href="reports.html?indicator=present-simple&student='+encodeURIComponent(s.user_id)+'">التقرير</a>'+btn+'</div></td></tr>';
}
function dashboard(){
 logoutButton.hidden=false;
 const total=ui.total,students=ui.rows;
 const active=students.filter(s=>s.active).length;
 const completed=students.filter(s=>s.parts_passed>=6).length;
 const exams=students.filter(s=>s.exam_best!=null).length;
 const pages=Math.max(1,Math.ceil(total/25));
 root.innerHTML='<main class="shell"><div class="eyebrow">STUDENT MANAGEMENT</div><h1 class="page-title">لوحة إدارة طلاب STEP</h1><p class="intro">دليل الطلاب وبيانات التواصل ونتائج المضارع البسيط. الصلاحية: <strong>'+(ui.role==="owner"?"مدير المنصة":"متابعة فقط")+'</strong></p><section class="stats"><div class="stat"><strong>'+total+'</strong><span>إجمالي الطلاب المطابقين للبحث</span></div><div class="stat"><strong>'+active+'</strong><span>حسابات مفعّلة بالصفحة</span></div><div class="stat"><strong>'+completed+'</strong><span>مكملين الأجزاء الستة بالصفحة</span></div><div class="stat"><strong>'+exams+'</strong><span>أدّوا الاختبار بالصفحة</span></div></section><section class="table-panel"><div class="table-top"><div><h2>قائمة الطلاب</h2><p>ابحث باسم المستخدم أو الإيميل أو رقم الموبايل</p></div><button id="export-students" class="btn btn-outline btn-small" type="button">تصدير Excel / CSV</button><form id="search-form" class="search"><input id="q" aria-label="البحث في الطلاب" placeholder="بحث عن طالب…" value="'+escapeHtml(ui.search)+'"><button class="btn btn-main" type="submit">بحث</button></form></div><div class="table-scroll"><table><thead><tr><th>اسم المستخدم</th><th>البريد الإلكتروني</th><th>رقم الموبايل</th><th>تقدم الدرس</th><th>أفضل اختبار</th><th>الحالة</th><th>آخر نشاط</th><th>الإجراء</th></tr></thead><tbody>'+(students.length?students.map(rowHtml).join(""):'<tr><td colspan="8" style="text-align:center;padding:35px;color:#75868d">مفيش طلاب مطابقين للبحث</td></tr>')+'</tbody></table></div><div class="bottom"><span>صفحة '+ui.page+' من '+pages+' — '+total+' طالب</span><div class="actions"><button id="prev" class="btn btn-outline btn-small" '+(ui.page<=1?"disabled":"")+'>السابق</button><button id="next" class="btn btn-outline btn-small" '+(ui.page>=pages?"disabled":"")+'>التالي</button></div></div></section><div class="footer">STEP with Seify · PRIVATE STEP MANAGEMENT</div></main>';

 injectAdminNavigation("students");
 const exportBtn=document.getElementById("export-students");
 exportBtn.onclick=async()=>{
  exportBtn.disabled=true;exportBtn.textContent="جاري تجهيز الملف…";
  try{
   const entries=[];
   const totalPages=Math.max(1,Math.ceil(ui.total/25));
   for(let page=1;page<=totalPages;page++){
    const batch=await api("/students?page="+page+"&q="+encodeURIComponent(ui.search));
    entries.push(...(batch.students||[]));
    exportBtn.textContent="جاري تجهيز "+entries.length+" طالب…";
   }
   const safeCell=value=>{
    let s=String(value??"");
    if(/^[\s]*[=+\-@]/.test(s))s="'"+s;
    return '"'+s.replace(/"/g,'""')+'"';
   };
   const headings=["اسم المستخدم","البريد الإلكتروني","الموبايل","أجزاء مكتملة","أفضل اختبار %","الحالة","تاريخ التسجيل","آخر نشاط"];
   const rows=entries.map(s=>[s.username,s.email,s.phone,s.parts_passed,s.exam_best??"",s.active?"مفعّل":"موقوف",s.created_at,s.last_activity??""]);
   const csv="\uFEFF"+[headings,...rows].map(row=>row.map(safeCell).join(",")).join("\r\n");
   const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
   const uri=URL.createObjectURL(blob);
   const a=document.createElement("a");a.href=uri;a.download="STEP_with_Seify_students_"+new Date().toISOString().slice(0,10)+".csv";
   document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(uri),5000);
  }catch(error){alert(errorMessage(error));}
  finally{exportBtn.disabled=false;exportBtn.textContent="تصدير Excel / CSV";}
 };
 document.getElementById("search-form").onsubmit=e=>{e.preventDefault();ui.search=document.getElementById("q").value.trim();ui.page=1;loadStudents();};
 document.getElementById("prev").onclick=()=>{ui.page--;loadStudents();};
 document.getElementById("next").onclick=()=>{ui.page++;loadStudents();};
 document.querySelectorAll("[data-status]").forEach(button=>button.onclick=async()=>{
  const id=button.dataset.id,active=button.dataset.status==="1";
  const student=ui.rows.find(s=>s.user_id===id);
  if(!student)return;
  if(!confirm((active?"تفعيل":"إيقاف")+' حساب '+student.username+'؟'))return;
  button.disabled=true;
  try{
   await api("/student-status",{method:"POST",body:JSON.stringify({user_id:id,active})});
   await loadStudents();
  }catch(error){alert(errorMessage(error));button.disabled=false;}
 });
}
async function loadStudents(){
 root.innerHTML='<main class="shell"><p>جاري تحميل بيانات الطلاب…</p></main>';
 try{
  const result=await api("/students?page="+ui.page+"&q="+encodeURIComponent(ui.search));
  ui.rows=result.students||[];ui.total=result.total||0;ui.role=result.role;
  dashboard();
 }catch(error){
  root.innerHTML='<main class="shell"><div class="panel"><div class="notice error">'+escapeHtml(errorMessage(error))+'</div><button id="try-again" class="btn btn-outline">إعادة المحاولة</button></div></main>';
  document.getElementById("try-again").onclick=loadStudents;
 }
}

function injectAdminNavigation(active){
 const container=document.createElement("nav");
 container.className="admin-tabs";container.setAttribute("aria-label","أقسام لوحة الإدارة");
 container.innerHTML='<button class="admin-tab '+(active==="students"?"is-active":"")+'" id="nav-students">الطلاب والنتائج</button><button class="admin-tab '+(active==="questions"?"is-active":"")+'" id="nav-questions">بنك الأسئلة</button><button class="admin-tab '+(active==="lessons"?"is-active":"")+'" id="nav-lessons">محتوى الدروس</button><a href="reports.html" class="admin-tab">التقارير والإحصائيات</a><a href="curriculum.html" class="admin-tab">المحاور والمؤشرات</a><a href="courses.html" class="admin-tab">إضافة دروس جديدة</a>';
 const anchor=root.querySelector(".intro")||root.querySelector(".page-title");
 if(anchor)anchor.after(container);
 document.getElementById("nav-students").onclick=()=>{ui.page=1;loadStudents();};
 document.getElementById("nav-questions").onclick=()=>loadQuestions();
 document.getElementById("nav-lessons").onclick=()=>loadLessonEditor();
}
async function loadQuestions(preserveId=null){
 root.innerHTML='<main class="shell"><p>جاري تحميل بنك الأسئلة…</p></main>';
 try{
  const result=await api("/questions");
  questionState.list=result.questions||[];
  questionState.sections=result.sections||[];
  questionState.currentId=preserveId||questionState.currentId||questionState.list[0]?.id||null;
  renderQuestionEditor();
 }catch(error){
  root.innerHTML='<main class="shell"><div class="panel"><div class="notice error">'+escapeHtml(errorMessage(error))+'</div><button id="try-again" class="btn btn-outline">إعادة المحاولة</button></div></main>';
  document.getElementById("try-again").onclick=()=>loadQuestions();
 }
}
function renderQuestionEditor(msg=""){
 const canEdit=ui.role==="owner";
 const options=questionState.sections.map(x=>'<option value="'+x.index+'">'+escapeHtml((x.index+1)+". "+x.title)+'</option>').join("");
 const visible=questionState.list.filter(q=>questionState.filter==="all"||q.part_index===Number(questionState.filter));
 const selected=questionState.list.find(q=>q.id===questionState.currentId)||null;
 root.innerHTML='<main class="shell"><div class="eyebrow">CONTENT MANAGEMENT</div><h1 class="page-title">إدارة بنك الأسئلة</h1><p class="intro">أضف الأسئلة أو عدل نصوصها وإجاباتها، واحفظ مسودة قبل نشر أي تغيير.</p><div id="question-nav-anchor"></div><div class="question-layout"><section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><strong>الأسئلة ('+questionState.list.length+')</strong>'+(canEdit?'<button type="button" class="btn btn-good btn-small" id="new-question">+ سؤال جديد</button>':'')+'</div><div class="field"><label for="question-filter">الجزء</label><select id="question-filter"><option value="all">جميع الأجزاء</option>'+options+'</select></div><div class="question-list" id="q-list">'+visible.map(q=>'<button type="button" class="q-item '+(q.id===questionState.currentId?"active":"")+'" data-edit="'+escapeHtml(q.id)+'"><small>'+(Number(q.part_index)+1)+' · '+(q.origin==="source"?"سؤال المصدر":"سؤال مضاف")+' · '+(q.status==="published"?"منشور":q.status==="draft"?"مسودة":"مؤرشف")+'</small><strong>'+escapeHtml(q.text)+'</strong></button>').join("")+'</div></section><section class="panel q-form" id="question-edit-area"></section></div><div class="footer">STEP with Seify · CONTENT EDITOR</div></main>';
 injectAdminNavigation("questions");
 const filter=document.getElementById("question-filter");
 filter.value=questionState.filter;
 filter.onchange=()=>{questionState.filter=filter.value;renderQuestionEditor();};
 document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{questionState.currentId=b.dataset.edit;renderQuestionEditor();});
 const newBtn=document.getElementById("new-question");if(newBtn)newBtn.onclick=()=>{questionState.currentId=null;renderQuestionEditor();};
 renderQuestionForm(selected,canEdit,msg);
}
function renderQuestionForm(q,canEdit,msg){
 const fresh=!q;
 const form=document.getElementById("question-edit-area");
 const correct=q?.correct||"A";
 const qopt=q?.options||{A:"",B:"",C:"",D:""};
 const sectionSelect=questionState.sections.map(s=>'<option value="'+s.index+'">'+escapeHtml((s.index+1)+". "+s.title)+'</option>').join("");
 form.innerHTML='<h2 style="margin:0 0 8px;font-size:21px">'+(fresh?"إضافة سؤال جديد":"تعديل السؤال")+'</h2><p style="margin:0;color:var(--muted);font-size:13px">'+(q?escapeHtml(q.id):"سؤال جديد")+'</p>'+(msg?'<div class="notice">'+escapeHtml(msg)+'</div>':'')+'<form id="question-form"><div class="field"><label for="part-index">جزء الدرس</label><select id="part-index">'+sectionSelect+'</select></div><div class="field"><label for="q-text">نص السؤال</label><textarea id="q-text" minlength="8" maxlength="2000" required>'+escapeHtml(q?.text||"")+'</textarea></div><div class="q-options">'+["A","B","C","D"].map(key=>'<div class="field"><label for="opt-'+key+'">الاختيار '+key+'</label><input id="opt-'+key+'" value="'+escapeHtml(qopt[key]||"")+'" required maxlength="500" dir="ltr"></div>').join("")+'</div><div class="field"><label for="q-correct">الإجابة الصحيحة</label><select id="q-correct">'+["A","B","C","D"].map(key=>'<option value="'+key+'">'+key+'</option>').join("")+'</select></div><div class="field"><label for="q-explain">شرح الإجابة</label><textarea id="q-explain" maxlength="2500">'+escapeHtml(q?.explanation||"")+'</textarea></div><div class="q-actions">'+(canEdit?'<button type="submit" class="btn btn-main" id="save-draft">حفظ كمسودة</button>'+(q&&q.has_edit?'<button type="button" class="btn btn-good" id="publish-q">نشر السؤال</button>':'')+(q&&q.origin==="custom"?'<button type="button" class="btn btn-danger" id="archive-q">أرشفة</button>':''):'')+'</div></form>';
 const selector=document.getElementById("part-index");selector.value=String(q?.part_index??Number(questionState.filter==="all"?0:questionState.filter));
 if(q?.origin==="source")selector.disabled=true;
 document.getElementById("q-correct").value=correct;
 if(!canEdit){form.querySelectorAll("input,textarea,select").forEach(x=>x.disabled=true);return;}
 document.getElementById("question-form").onsubmit=async e=>{
  e.preventDefault();
  const b=document.getElementById("save-draft");b.disabled=true;b.textContent="جاري الحفظ…";
  const payload={
   id:q?.id||null,part_index:Number(selector.value),
   text:document.getElementById("q-text").value,
   options:Object.fromEntries(["A","B","C","D"].map(x=>[x,document.getElementById("opt-"+x).value])),
   correct:document.getElementById("q-correct").value,
   explanation:document.getElementById("q-explain").value
  };
  try{
   const saved=await api("/questions/save",{method:"POST",body:JSON.stringify(payload)});
   questionState.currentId=saved.id;await loadQuestions(saved.id);
   alert("تم حفظ السؤال كمسودة. اضغط نشر السؤال لعرضه للطلاب.");
  }catch(error){alert(errorMessage(error));b.disabled=false;b.textContent="حفظ كمسودة";}
 };
 const pub=document.getElementById("publish-q");
 if(pub)pub.onclick=async()=>{if(!confirm("نشر السؤال للطلاب الآن؟"))return;pub.disabled=true;try{await api("/questions/publish",{method:"POST",body:JSON.stringify({id:q.id})});await loadQuestions(q.id);}catch(error){alert(errorMessage(error));pub.disabled=false;}};
 const archive=document.getElementById("archive-q");
 if(archive)archive.onclick=async()=>{if(!confirm("أرشفة السؤال وإخفاؤه عن الطلاب؟"))return;archive.disabled=true;try{await api("/questions/archive",{method:"POST",body:JSON.stringify({id:q.id})});await loadQuestions(q.id);}catch(error){alert(errorMessage(error));archive.disabled=false;}};
}


const lessonEditor={rows:[],active:0};
const lessonField=(id,label,value,opts={})=>{
 const isArea=!!opts.area;
 const input=isArea?'<textarea id="'+id+'" rows="'+(opts.rows||3)+'" maxlength="'+(opts.max||4500)+'" '+(opts.ltr?'dir="ltr"':'')+' required>'+escapeHtml(value||"")+'</textarea>':
 '<input id="'+id+'" type="text" maxlength="'+(opts.max||250)+'" value="'+escapeHtml(value||"")+'" '+(opts.ltr?'dir="ltr"':'')+' required>';
 return '<div class="field"><label for="'+id+'">'+label+'</label>'+input+'</div>';
};
async function loadLessonEditor(partIndex=null){
 root.innerHTML='<main class="shell"><p>جاري تحميل محتوى الدروس…</p></main>';
 try{
  const result=await api("/lessons");
  lessonEditor.rows=result.sections||[];
  if(partIndex!=null)lessonEditor.active=partIndex;
  renderLessonEditor();
 }catch(error){
  root.innerHTML='<main class="shell"><div class="panel"><div class="notice error">'+escapeHtml(errorMessage(error))+'</div><button class="btn btn-outline" id="retry-lessons">إعادة المحاولة</button></div></main>';
  document.getElementById("retry-lessons").onclick=()=>loadLessonEditor();
 }
}
function renderLessonEditor(){
 const all=lessonEditor.rows,entry=all.find(x=>x.index===lessonEditor.active);
 if(!entry)return;
 const canEdit=ui.role==="owner";
 const content=entry.draft||entry.published||entry.base;
 const isDraft=!!entry.draft,wasPublished=!!entry.published;
 const lessonNames=all.map(s=>'<button class="q-item '+(s.index===lessonEditor.active?'active':'')+'" data-lesson-index="'+s.index+'" type="button"><small>PART '+String(s.index+1).padStart(2,'0')+' · '+(s.draft?'مسودة قيد التحرير':s.published?'تم تعديل النسخة المنشورة':'المحتوى الأصلي')+'</small><strong style="direction:rtl;text-align:right">'+escapeHtml((s.draft||s.published||s.base).titleAr)+'</strong></button>').join("");
 const src=entry.base;
 const exampleFields=src.examples.map((_,i)=>{
  const ex=content.examples[i]||{en:"",ar:""};
  return '<div class="lesson-edit-block"><strong>مثال '+(i+1)+'</strong><div class="lesson-edit-row">'+lessonField('example-en-'+i,'الجملة بالإنجليزي',ex.en,{ltr:true,max:500})+lessonField('example-ar-'+i,'المعنى بالعربي',ex.ar,{max:500})+'</div></div>';
 }).join("");
 const tileFields=src.tiles.map((_,i)=>{
  const tile=content.tiles[i]||{label:"",text:""};
  return '<div class="lesson-edit-block"><strong>بطاقة '+(i+1)+'</strong><div class="lesson-edit-row">'+lessonField('tile-label-'+i,'عنوان البطاقة',tile.label,{max:100})+lessonField('tile-text-'+i,'محتوى البطاقة',tile.text,{ltr:true,max:300})+'</div></div>';
 }).join("");
 const rules=content.rule.join('\n');
 const altField=src.alternativeRule?lessonField('lesson-alt-rule','القاعدة البديلة: كل عنصر في سطر',content.alternativeRule?.join('\n')||src.alternativeRule.join('\n'),{area:true,rows:4,max:2500}):"";
 root.innerHTML='<main class="shell"><div class="eyebrow">LESSON CONTENT MANAGEMENT</div><h1 class="page-title">إدارة شرح الدروس</h1><p class="intro">عدّل العناوين والقواعد والأمثلة، واحفظ مسودة. لن يظهر التعديل للطلاب إلا عند نشره.</p><div class="question-layout"><section class="panel"><strong>أجزاء Present Simple</strong><div class="question-list">'+lessonNames+'</div></section><section class="panel q-form"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h2 style="margin:0;font-size:22px">الجزء '+(entry.index+1)+': '+escapeHtml(content.titleAr)+'</h2><span class="lesson-status '+(isDraft?'draft':'')+'">'+(isDraft?'مسودة غير منشورة':wasPublished?'نسخة منشورة':'محتوى أصلي')+'</span></div><form id="lesson-content-form"><h3 class="lesson-edit-heading">بيانات الجزء</h3><div class="lesson-edit-row">'+
  lessonField('lesson-title','عنوان الدرس',content.titleAr,{max:110})+
  lessonField('lesson-subtitle','العنوان الفرعي',content.subtitle,{max:180})+
  lessonField('lesson-short','وصف مختصر',content.short,{max:180})+
  lessonField('lesson-duration','المدة',content.duration,{max:35})+
 '</div>'+lessonField('lesson-description','الشرح الرئيسي',content.description,{area:true,rows:7,max:4500})+
 '<h3 class="lesson-edit-heading">القواعد</h3><div class="lesson-editor-help">اكتب كل عنصر من القاعدة في سطر مستقل، بما في ذلك علامة +. هتظهر العناصر بالترتيب من الشمال لليمين.</div>'+
 lessonField('lesson-rule','القاعدة الرئيسية: كل عنصر في سطر',rules,{area:true,rows:5,max:2500})+altField+
 '<h3 class="lesson-edit-heading">القاعدة الذهبية</h3>'+lessonField('gold-title','عنوان القاعدة الذهبية',content.gold.title,{max:120})+lessonField('gold-body','نص القاعدة الذهبية',content.gold.body,{area:true,max:2200,rows:5})+
 '<h3 class="lesson-edit-heading">أمثلة الشرح</h3>'+exampleFields+
 '<h3 class="lesson-edit-heading">البطاقات التعليمية</h3>'+tileFields+
 '<h3 class="lesson-edit-heading">الخطأ الشائع والتصحيح</h3>'+lessonField('mistake-wrong','الجملة الخطأ',content.mistake.wrong,{ltr:true,max:300})+
 lessonField('mistake-right','الجملة الصحيحة',content.mistake.right,{ltr:true,max:300})+
 lessonField('mistake-why','سبب التصحيح',content.mistake.why,{area:true,max:950})+
 '<div class="q-actions">'+(canEdit?'<button class="btn btn-main" type="submit" id="save-lesson">حفظ كمسودة</button>'+(isDraft?'<button class="btn btn-good" type="button" id="publish-lesson">نشر المسودة للطلاب</button>':'')+
 ((isDraft||wasPublished)?'<button class="btn btn-danger" type="button" id="reset-lesson">استعادة المحتوى الأصلي</button>':''):'')+'</div></form></section></div><div class="footer">STEP with Seify · LESSON CONTENT EDITOR</div></main>';
 injectAdminNavigation("lessons");
 document.querySelectorAll("[data-lesson-index]").forEach(b=>b.onclick=()=>{if(!confirmDiscardLesson())return;lessonEditor.active=Number(b.dataset.lessonIndex);renderLessonEditor();window.scrollTo(0,0);});
 const form=document.getElementById("lesson-content-form");
 if(!canEdit){form.querySelectorAll("input,textarea,button").forEach(el=>el.disabled=true);return;}
 let dirty=false;
 const publish=document.getElementById("publish-lesson");
 form.addEventListener("input",()=>{dirty=true;if(publish){publish.disabled=true;publish.title="احفظ التعديلات كمسودة قبل النشر";}});
 function confirmDiscardLesson(){return !dirty||confirm("في تعديلات غير محفوظة. تجاهل التعديلات؟");}
 const value=id=>document.getElementById(id).value.trim();
 form.onsubmit=async event=>{
  event.preventDefault();
  const b=document.getElementById("save-lesson");b.disabled=true;b.textContent="جاري الحفظ…";
  const tokenList=id=>value(id).split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const payload={part_index:entry.index,content:{
   titleAr:value("lesson-title"),subtitle:value("lesson-subtitle"),
   short:value("lesson-short"),duration:value("lesson-duration"),
   description:value("lesson-description"),rule:tokenList("lesson-rule"),
   ...(src.alternativeRule?{alternativeRule:tokenList("lesson-alt-rule")}:{}),
   gold:{title:value("gold-title"),body:value("gold-body")},
   mistake:{wrong:value("mistake-wrong"),right:value("mistake-right"),why:value("mistake-why")},
   examples:src.examples.map((_,i)=>({en:value("example-en-"+i),ar:value("example-ar-"+i)})),
   tiles:src.tiles.map((t,i)=>({icon:t.icon,label:value("tile-label-"+i),text:value("tile-text-"+i)}))
  }};
  try{
   await api("/lessons/save",{method:"POST",body:JSON.stringify(payload)});
   dirty=false;await loadLessonEditor(entry.index);
   alert("المسودة اتحفظت. الدرس المنشور للطلاب ما اتغيرش.");
  }catch(error){alert(errorMessage(error));b.disabled=false;b.textContent="حفظ كمسودة";}
 };
 if(publish)publish.onclick=async()=>{
  if(dirty){alert("احفظ التعديلات كمسودة الأول.");return;}
  if(!confirm("متأكد إنك راجعت الشرح وعايز تنشره للطلاب؟"))return;
  publish.disabled=true;
  try{
   await api("/lessons/publish",{method:"POST",body:JSON.stringify({part_index:entry.index})});
   await loadLessonEditor(entry.index);
   alert("تم نشر محتوى الجزء للطلاب.");
  }catch(error){alert(errorMessage(error));publish.disabled=false;}
 };
 const reset=document.getElementById("reset-lesson");
 if(reset)reset.onclick=async()=>{
  if(!confirm("استعادة نسخة الدرس الأصلية؟ هتُلغى المسودة والنسخة المنشورة لهذا الجزء."))return;
  reset.disabled=true;
  try{
   await api("/lessons/reset",{method:"POST",body:JSON.stringify({part_index:entry.index})});
   await loadLessonEditor(entry.index);
  }catch(error){alert(errorMessage(error));reset.disabled=false;}
 };
}

async function logout(){await db.auth.signOut();ui.role=null;ui.rows=[];showLogin();}
logoutButton.onclick=logout;
async function init(){try{const {data:{session}}=await db.auth.getSession();if(session)await checkAdmin();else showLogin();}catch(e){showLogin("تعذر الاتصال بالخدمة")}}
init();
</script>
</body>
</html>
