<style>

*{box-sizing:border-box}body{margin:0;background:#f6f8f6;color:#213741;font:14px/1.85 Cairo,Tahoma,sans-serif}

main{max-width:1200px;padding:28px 18px 70px;margin:auto}.eyebrow{font:800 11px "DM Sans";letter-spacing:.13em;color:var(--green)}.lead{color:var(--muted);margin-top:0}
.btn{border:0;padding:10px 15px;border-radius:9px;background:var(--navy);color:#fff;font-weight:800;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none}
.btn.alt{background:#fff;border:1px solid #d6e1de;color:var(--navy)}.btn:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #c1a276;outline-offset:2px}.btn:disabled{opacity:.55;cursor:wait}
.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:23px;margin:20px 0;box-shadow:0 6px 30px #12282208}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:18px 0}.stat{background:white;border:1px solid var(--line);border-radius:12px;padding:18px}.stat b{display:block;color:var(--navy);font:800 31px "DM Sans";direction:ltr;text-align:right}.stat span{color:var(--muted);font-size:12px}
.sectionbar{display:grid;grid-template-columns:155px 1fr 130px;gap:15px;align-items:center;margin:14px 0}.sectionbar label{font-size:12px;font-weight:700}.track{height:12px;background:#edf2f0;border-radius:30px;overflow:hidden}.fill{height:100%;background:var(--green);border-radius:30px}.sectionbar strong{font:700 12px Cairo;text-align:left}
.table-wrap{overflow:auto;width:100%}table{border-collapse:collapse;width:100%;min-width:680px}th,td{padding:12px;border-top:1px solid var(--line);text-align:right;vertical-align:middle}th{background:#f7faf8;font-size:12px;color:#62777c}td{font-size:13px}
.form-line{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.form-line input{padding:10px 13px;border:1px solid #d4e2dd;border-radius:9px;background:white;min-width:230px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block;font:600 13px "DM Sans",Arial}
.small{color:var(--muted);font-size:12px}.insight-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0}.insight-card{border:1px solid var(--line);padding:16px;border-radius:12px;background:#fcfdfc}.insight-card h3{margin:0 0 4px;font-size:14px;color:var(--navy)}.insight-card strong{font:800 27px "DM Sans",Arial,sans-serif;color:var(--green)}.insight-card p{margin:4px 0;font-size:12px}.insight-chip{display:inline-block;padding:2px 10px;border-radius:20px;background:#e7f5ee;color:#176449;font-weight:800;font-size:11px}.insight-chip.watch{background:#fff1de;color:#985f1f}.insight-chip.weak{background:#fff0ed;color:#9b3931}.insight-chip.unknown{background:#eef2f3;color:#63747a}.insight-note{border-right:3px solid #c5a16c;padding:10px 12px;background:#fffaf0;color:#6d603b;border-radius:8px;font-size:12px}.insight-list{padding:0 20px 0 0}.insight-list li{margin:8px 0}.insight-table{width:100%}@media(max-width:850px){.insight-grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.insight-grid{grid-template-columns:1fr}}.indicator-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.indicator-card{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid #dfe9e4;border-radius:12px;padding:15px;text-decoration:none;color:inherit;background:#fdfefd}.indicator-card:hover,.indicator-card:focus-visible{border-color:var(--green);background:#f0f8f4}.indicator-card[hidden]{display:none!important}.indicator-card strong{display:block;color:var(--navy);font-size:14px}.indicator-card .ltr{font-size:12px;color:var(--muted)}.indicator-status{border-radius:30px;background:#f0f2f2;color:#647a7d;font-size:11px;font-weight:800;white-space:nowrap;padding:4px 9px}.indicator-status.is-ready{background:#dff3e8;color:#136144}.indicator-arrow{color:var(--green);font-weight:800}.report-search{width:100%;max-width:420px;padding:11px 14px;border:1px solid #d5e2dd;border-radius:10px;font:inherit;margin-top:7px}.report-context{border-right:3px solid var(--green);padding:12px 15px;background:#edf7f2;border-radius:9px;margin:13px 0 18px}.report-context strong{color:var(--navy)}@media(max-width:750px){.indicator-grid{grid-template-columns:1fr}}.tabs{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.error{background:#fff0ef;color:#9b4545;border:1px solid #e9cbcb;padding:16px;border-radius:10px}
.impact-list{display:grid;gap:12px}.impact-item{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fcfdfc}.impact-item h3{font-size:15px;margin:0}.impact-numbers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:12px 0}.impact-numbers>div{background:#f4f8f6;padding:10px;border-radius:9px}.impact-numbers strong,.impact-numbers small{display:block}.impact-numbers strong{font:800 22px "DM Sans",Arial;color:var(--navy)}.impact-numbers small{font-size:11px;color:var(--muted)}@media(max-width:620px){.impact-numbers{grid-template-columns:1fr 1fr}.impact-numbers>div:last-child{grid-column:1/-1}}
.followup-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0;padding:16px;border:1px solid #dbe7e2;border-radius:12px;background:#f8fbf9}.followup-form label{font-size:12px;font-weight:800;display:grid;gap:5px}.followup-form select,.followup-form input,.followup-form textarea{font:inherit;background:white;border:1px solid #cfdbd6;border-radius:8px;padding:10px;width:100%;min-width:0}.followup-wide{grid-column:1/-1}.followup-item{border-top:1px solid var(--line);padding:13px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}.followup-item p{margin:4px 0;color:#4b6062}.followup-item small{color:var(--muted)}.followup-pill{font-size:11px;display:inline-block;margin-inline-start:7px;border-radius:20px;background:#e9f5ef;color:#16674f;padding:3px 9px;font-weight:800}@media(max-width:780px){.followup-form{grid-template-columns:1fr}.followup-item{align-items:flex-start}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.sectionbar{grid-template-columns:1fr;gap:4px}.panel{padding:15px}}
.step-brand-image{display:block;width:206px;max-width:100%;height:auto;flex:none}@media(max-width:480px){.step-brand-image{width:158px}}</style>

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const date=s=>s?new Date(s).toLocaleString("ar-SA",{year:"numeric",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}):"—";
const num=n=>Number(n||0).toLocaleString("ar-SA");
async function api(url,body){
 const {data:{session}}=await client.auth.getSession();
 if(!session)throw Error("يرجى تسجيل دخول الأدمن أولًا");
 const r=await fetch(SUPABASE_URL+"/functions/v1/step-admin"+url,{method:body===undefined?"GET":"POST",headers:{"Authorization":"Bearer "+session.access_token,"apikey":ANON_KEY,"Content-Type":"application/json"},body:body===undefined?undefined:JSON.stringify(body)});
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw Error(j.error||"تعذر فتح التقرير");
 return j;
}
function message(text){pageRoot.innerHTML='<div class="panel error">'+esc(text)+' <a class="btn alt" href="./">الرجوع للوحة الأدمن</a></div>';}
function csvCell(v){let s=String(v??"");if(/^\s*[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function download(filename,headers,rows){
 const csv="\uFEFF"+[headers,...rows].map(row=>row.map(csvCell).join(",")).join("\r\n");
 const u=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
 const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(u),5000);
}
const insightPct=n=>n==null?"—":n+"%";
const insightTime=n=>n==null?"—":n+" ثانية تقريبًا";
function skillTone(status){
 return status==="تحتاج متابعة"?"weak":status==="تحتاج تدريب"?"watch":status==="مستوى جيد"?"":"unknown";
}
function skillCards(sections){
 if(!sections?.length)return '<p class="small">لا توجد بيانات أسئلة تفصيلية بعد.</p>';
 return '<div class="insight-grid">'+sections.map(p=>'<div class="insight-card"><h3>'+
 esc(p.title)+'</h3><strong>'+insightPct(p.accuracy)+'</strong><p>'+
 num(p.answers)+' إجابة · '+insightTime(p.avg_seconds)+'</p><span class="insight-chip '+
 skillTone(p.status)+'">'+esc(p.status)+'</span><p>'+esc(p.recommendation)+'</p></div>').join("")+'</div>';
}
function renderLearningInsights(v){
 if(!v)return "";
 const details=(v.questions||[]).filter(q=>q.answers>=2).slice(0,15);
 return '<section class="panel" id="skill-insights"><div class="eyebrow">LEARNING INSIGHTS</div>'+
 '<h2>تحليل المهارات وتوصيات المتابعة</h2>'+
 '<p class="insight-note">'+esc(v.note||"أزمنة الإجابة تقديرية.")+
 (v.truncated?' · يتم تحليل أحدث 1500 إجابة فقط.':'')+'</p>'+
 '<div class="stats">'+[
 ["إجابات مُحلّلة",num(v.answers)],["دقة الإجابة",insightPct(v.accuracy)],
 ["زمن متوسط للإجابة",insightTime(v.avg_seconds)],["أزمنة مسجّلة",num(v.timed_answers)]
 ].map(x=>'<div class="stat"><b>'+esc(x[1])+'</b><span>'+esc(x[0])+'</span></div>').join("")+'</div>'+
 skillCards(v.sections)+
 '<h2>أولوية المتابعة</h2>'+
 ((v.priority||[]).length?'<ul class="insight-list">'+v.priority.map(i=>'<li><strong>'+esc(i.title)+
 ' — '+esc(i.status)+'</strong>: '+esc(i.action)+'</li>').join("")+'</ul>':
 '<p class="small">مفيش حكم بوجود ضعف مؤكّد من البيانات المتاحة. بعض المهارات قد تحتاج عينة أكبر.</p>')+
 '<h2>أسئلة تستحق المراجعة</h2>'+
 '<div class="table-wrap"><table class="insight-table"><thead><tr><th>السؤال</th><th>الإجابات</th><th>الدقة</th><th>متوسط الزمن</th><th>اختيار غلط متكرر</th></tr></thead><tbody>'+
 (details.length?details.map(x=>'<tr><td><span class="ltr">'+esc(x.question_text)+'</span></td><td>'+
 num(x.answers)+'</td><td>'+insightPct(x.accuracy)+'</td><td>'+insightTime(x.avg_seconds)+
 '</td><td>'+(x.common_wrong?esc(x.common_wrong.letter+' — '+(x.common_wrong.option||"")):"—")+'</td></tr>').join(""):

 '</tbody></table></div></section>';
}
function renderBeforeAfter(items,limited){
 if(!Array.isArray(items)||!items.length)return "";

 '<p class="insight-note">القياس ده مبدئي، ويحتاج إجابات كافية على أسئلة مختلفة في نفس المهارة قبل وبعد التكليف.'+

function renderCohortInsights(v){

const followupKind={review:"مراجعة الشرح",practice:"تدريب إضافي",video:"فيديو Seify"};
const followupState={pending:"بانتظار الطالب",reviewed:"راجع المحتوى — منتظر التدريب",completed:"تدريب ناجح بعد التكليف",cancelled:"ملغي"};
function followupPanel(studentId,rows){
 const options=Array.from({length:6},(_,i)=>'<option value="'+i+'">'+esc((i+1)+". "+(window.STEP_PART_TITLES?.[i]||["استخدمه إمتى؟","ابنِ الجملة","s / es / ies","النفي","السؤال","الكلمات الدالة"][i]))+'</option>').join("");

 '<label>المهارة<select name="part_index" required>'+options+'</select></label>'+
 '<label>نوع المتابعة<select name="kind"><option value="review">راجع الشرح</option><option value="practice">حل تدريب</option><option value="video">شاهد الفيديو (مرحلة s / es / ies فقط)</option></select></label>'+
 '<label>الموعد المستهدف (اختياري)<input type="date" name="due_date"></label>'+
 '<label class="followup-wide">رسالة قصيرة للطالب<textarea name="note" maxlength="350" rows="2" placeholder="مثال: ركّز على سبب إضافة s مع He / She / It"></textarea></label>'+
 '<button class="btn" type="submit">+ كلف الطالب بالمتابعة</button><span id="followup-message" class="small" role="status"></span></form>':
 '<p class="small">يمكنك مشاهدة المتابعة؛ إضافة أو إلغاء التكليفات متاح لمدير المنصة فقط.</p>';
 const items=rows?.length?rows.map(t=>'<div class="followup-item"><div><b>'+esc(t.title)+'</b> · '+esc(followupKind[t.kind]||t.kind)+
 ' <span class="followup-pill">'+esc(followupState[t.status]||t.status)+'</span>'+
 (t.note?'<p>'+esc(t.note)+'</p>':'')+
 '<small>أُسند: '+date(t.assigned_at)+(t.due_at?' · المستهدف: '+date(t.due_at):'')+'</small></div>'+
 (adminRole==="owner"&&t.status!=="cancelled"&&t.status!=="completed"?

 '<p class="small">مفيش تكليفات متابعة للطالب حتى الآن.</p>';
 return '<section class="panel" id="student-followups"><div class="eyebrow">STUDENT SUCCESS CENTER</div>'+
 '<h2>خطة متابعة الطالب</h2><p class="small">التكليف بيتأكد تلقائيًا بعد تدريب ناجح جديد في نفس المهارة. وضع علامة «راجعت» لوحده لا يثبت الإتقان.</p>'+

async function refreshFollowups(id){
 const response=await api("/students/"+encodeURIComponent(id)+"/followups");
 const old=document.getElementById("student-followups");
 if(!old)return;
 old.outerHTML=followupPanel(id,response.followups||[]);
 wireFollowups(id);
}
function wireFollowups(id){
 const form=document.getElementById("followup-form");
 if(form)form.onsubmit=async e=>{
  e.preventDefault();
  const part=Number(form.elements.namedItem("part_index").value),
   kind=form.elements.namedItem("kind").value,
   note=form.elements.namedItem("note").value.trim(),
   due=form.elements.namedItem("due_date").value;
  const message=document.getElementById("followup-message");
  if(kind==="video"&&part!==2){message.textContent="الفيديو متاح حاليًا في مرحلة s / es / ies فقط.";return;}
  const button=form.querySelector('button[type="submit"]');button.disabled=true;
  try{
   await api("/students/"+encodeURIComponent(id)+"/followups",{
    part_index:part,kind,note,due_at:due?new Date(due+"T23:59:59").toISOString():null});
   await refreshFollowups(id);
  }catch(err){message.textContent=err.message;button.disabled=false;}
 };
 document.querySelectorAll("[data-cancel-followup]").forEach(b=>b.onclick=async()=>{
  if(!confirm("إلغاء متابعة الطالب دي؟"))return;
  b.disabled=true;
  try{await api("/followups/"+encodeURIComponent(b.dataset.cancelFollowup)+"/cancel",{});await refreshFollowups(id);}
  catch(err){alert(err.message);b.disabled=false;}
 });
}
async function analytics(slug=activeIndicator?.slug||"present-simple"){
 pageRoot.innerHTML='<p>جاري تحميل إحصائيات المنصة…</p>';
 try{

  const a=result.overview,parts=result.parts||[],rows=students.students||[];total=students.total||0;

  const isAgreement=slug==="subject-verb-agreement";

  '<p class="lead"><span class="ltr">'+esc(indicator.title_en)+'</span> · بيانات تخص المؤشر ده فقط، مش باقي الدروس.</p>'+
  '<div class="report-context"><strong>نطاق التقرير: '+esc(indicator.title_ar)+'</strong> — بعض بيانات الحسابات إجمالي على مستوى المنصة، أما نتائج التدريبات والتحليلات فهي خاصة بالمؤشر.</div><section class="stats">'+
   [["إجمالي حسابات المنصة",a.students_total],["حسابات المنصة المفعّلة",a.students_active],["أكملوا الدرس",a.students_completed],["أدّوا النهائي",a.students_exam_taken],["محاولات التدريب",a.practice_attempts],["محاولات النهائي",a.exam_attempts],["متوسط نتيجة النهائي",pct(a.avg_exam_percent)]].map(x=>'<div class="stat"><b>'+esc(x[1]==null?"—":x[1])+'</b><span>'+x[0]+'</span></div>').join("")+
   '</section><section class="panel"><h2>أداء أجزاء '+esc(indicator.title_ar)+'</h2><p class="small">عدد الطلاب اللي حلّوا في كل جزء، ونسبة الطلاب اللي نجحوا فيه.</p>'+
   parts.map(p=>{const tried=Number(p.students_tried||0),passed=Number(p.students_passed||0);
   return '<div class="sectionbar"><label>'+esc((p.part_index+1)+". "+p.title)+'</label><div class="track"><div class="fill" style="width:'+(100*tried/max)+'%"></div></div><strong>'+num(tried)+' طالب · '+(tried?Math.round(100*passed/tried):0)+'% نجاح</strong></div>';
   }).join("")+
   '<div class="table-wrap"><table><thead><tr><th>الجزء</th><th>الطلاب المجربون</th><th>الطلاب الناجحون</th><th>المحاولات</th><th>متوسط الدرجة</th></tr></thead><tbody>'+
   parts.map(p=>'<tr><td>'+esc(p.title)+'</td><td>'+num(p.students_tried)+'</td><td>'+num(p.students_passed)+'</td><td>'+num(p.attempts)+'</td><td>'+pct(p.avg_score_percent)+'</td></tr>').join("")+'</tbody></table></div></section>'+
   '<section class="panel"><h2>التقارير الفردية</h2><form class="form-line" id="search"><input id="search-q" aria-label="بحث باسم الطالب أو الإيميل أو الهاتف" placeholder="اسم الطالب أو الإيميل أو التليفون" value="'+esc(q)+'"><button class="btn" type="submit">بحث</button><button type="button" class="btn alt" id="reload">تحديث</button></form><div class="table-wrap"><table><thead><tr><th>الطالب</th><th>التواصل</th><th>التقدم</th><th>أفضل اختبار</th><th>التقرير</th></tr></thead><tbody>'+
   (rows.length?rows.map(s=>'<tr><td><span class="ltr">'+esc(s.username)+'</span></td><td>'+esc(s.email)+'</td><td>'+(isAgreement?(byStudent.get(s.user_id)?.parts_passed??0):s.parts_passed)+'/'+(isAgreement?5:6)+'</td><td>'+((isAgreement?byStudent.get(s.user_id)?.exam_best:s.exam_best)==null?"—":(isAgreement?byStudent.get(s.user_id)?.exam_best:s.exam_best)+"%")+'</td><td><button class="btn alt" data-open="'+esc(s.user_id)+'">فتح التقرير</button></td></tr>').join(""):'<tr><td colspan="5">لا توجد نتائج.</td></tr>')+
   '</tbody></table></div><div class="form-line" style="margin-top:15px"><span class="small">الصفحة '+page+' · '+num(total)+' طالب</span><button class="btn alt" id="prev" '+(page===1?'disabled':'')+'>السابق</button><button class="btn alt" id="next" '+(page*25>=total?'disabled':'')+'>التالي</button></div></section>';

  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{
    history.pushState({}, "",indicatorStudentLink(slug,b.dataset.open));report(b.dataset.open,slug);

async function report(id,slug=activeIndicator?.slug||"present-simple"){
 pageRoot.innerHTML='<p>جاري تحميل تقرير الطالب…</p>';
 try{
  const indicator=findIndicator(slug);
  if(!indicator?.report_ready)throw Error("مفيش تقرير متاح للمؤشر ده");
  activeIndicator=indicator;
  const [r,followupData]=await Promise.all([api("/indicators/"+encodeURIComponent(slug)+"/students/"+encodeURIComponent(id)+"/report"),
    slug==="present-simple"?api("/students/"+encodeURIComponent(id)+"/followups"):Promise.resolve({followups:[]})]);
  const s=r.student,x=r.summary;
  const sectionRows=r.sections.map(p=>'<tr><td>'+esc((p.index+1)+". "+p.title)+'</td><td>'+p.attempts+'</td><td>'+(p.best_percent==null?"—":p.best_percent+"%")+'</td><td>'+(p.passed?"ناجح":"لم يجتز")+'</td><td>'+date(p.latest_attempt)+'</td></tr>').join("");
  const attemptRows=r.attempts.map(a=>'<tr><td>'+date(a.attempted_at)+'</td><td>'+esc(a.section_title)+'</td><td>'+a.correct_count+'/'+a.total_questions+'</td><td>'+a.percentage+'%</td><td>'+(a.passed?"ناجح":"غير ناجح")+'</td></tr>').join("");
  const exams=r.exams.map(e=>'<tr><td>'+date(e.attempted_at)+'</td><td>'+e.correct_count+'/'+e.total_questions+'</td><td>'+e.percentage+'%</td></tr>').join("");
  pageRoot.innerHTML='<div class="eyebrow">STUDENT PERFORMANCE · '+esc(indicator.title_ar)+'</div><h1>تقرير الطالب في '+esc(indicator.title_ar)+' — <span class="ltr">'+esc(s.username)+'</span></h1><div class="form-line"><button id="back" class="btn alt">العودة للإحصائيات</button><button id="export" class="btn">تصدير محاولات الطالب CSV</button></div><div class="panel"><div class="form-line"><span>الإيميل: <span class="ltr">'+esc(s.email||"—")+'</span></span><span>الموبايل: <span class="ltr">'+esc(s.phone||"—")+'</span></span><span>الحالة: '+(s.active?"مفعّل":"موقوف")+'</span><span>تاريخ التسجيل: '+date(s.joined)+'</span></div></div><section class="stats">'+
   [["الأجزاء الناجحة",x.passed_parts+"/"+x.total_parts],["محاولات التدريب",x.practice_attempts],["محاولات الاختبار",x.exam_attempts],["أفضل اختبار",x.best_exam_percent==null?"—":x.best_exam_percent+"%"]].map(t=>'<div class="stat"><b>'+esc(t[1])+'</b><span>'+t[0]+'</span></div>').join("")+
   '</section><section class="panel"><h2>الأداء في كل جزء</h2><div class="table-wrap"><table><thead><tr><th>الجزء</th><th>المحاولات المعروضة</th><th>أفضل درجة</th><th>الحالة</th><th>آخر محاولة</th></tr></thead><tbody>'+sectionRows+'</tbody></table></div></section><section class="panel"><h2>محاولات التدريب</h2>'+(x.part_history_truncated?'<p class="small">يتم عرض أحدث 300 محاولة.</p>':'')+
   '<div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>الجزء</th><th>الدرجة</th><th>النسبة</th><th>النتيجة</th></tr></thead><tbody>'+(attemptRows||'<tr><td colspan="5">لم يبدأ الطالب التدريبات.</td></tr>')+'</tbody></table></div></section><section class="panel"><h2>نتائج الاختبار النهائي</h2>'+(x.exam_history_truncated?'<p class="small">يتم عرض أحدث 150 محاولة.</p>':'')+
   '<div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>الدرجة</th><th>النسبة</th></tr></thead><tbody>'+(exams||'<tr><td colspan="3">لا توجد اختبارات نهائية.</td></tr>')+'</tbody></table></div></section>';
  pageRoot.insertAdjacentHTML("beforeend",renderLearningInsights(r.insights)+renderBeforeAfter(r.followup_impact,r.impact_history_limited)+
   (slug==="present-simple"?followupPanel(id,followupData.followups||[]):
   '<section class="panel"><h2>خطة متابعة هذا المؤشر</h2><p class="small">المتابعات الفردية للدرس الثاني هتتفعّل بعد أول بيانات حقيقية من الطلاب. تقارير درجاته وأزمنة أسئلته مستقلة بالفعل.</p></section>'));
  if(slug==="present-simple")wireFollowups(id);
  document.getElementById("back").onclick=()=>{history.pushState({},"",indicatorLink(slug));analytics(slug);};
  document.getElementById("export").onclick=()=>{
   const head=["النوع","التاريخ","الجزء","الإجابات الصحيحة","إجمالي الأسئلة","النسبة","ناجح"];
   const practice=r.attempts.map(a=>["تدريب",a.attempted_at,a.section_title,a.correct_count,a.total_questions,a.percentage,a.passed?"نعم":"لا"]);
   const results=r.exams.map(e=>["نهائي",e.attempted_at,"Final Exam",e.correct_count,e.total_questions,e.percentage,""]);
   download("STEP_"+slug+"_"+s.username+"_report.csv",head,[...practice,...results]);
  };
 }catch(e){message(e.message);}
}
async function init(){
 try{
  const {data:{session}}=await client.auth.getSession();
  if(!session){message("تسجيل الدخول مطلوب. افتح لوحة الأدمن وسجل دخولك الأول.");return;}
  const me=await api("/me");adminRole=me.role||"viewer";
  logoutButton.hidden=false;
  const params=new URLSearchParams(location.search);
  const requested=params.get("indicator");
  const id=params.get("student");
  const catalog=await api("/indicators");
  indicatorCatalog=catalog.indicators||[];
  if(!requested&&!id)hub();
  else{
   const slug=requested||(id?"present-simple":null);
   if(!slug||!findIndicator(slug)){message("المؤشر المطلوب غير موجود");return;}
   if(id&&/^[0-9a-f-]{36}$/i.test(id)){
    if(!findIndicator(slug)?.report_ready){await openIndicator(slug);return;}
    await report(id,slug);
   }else await openIndicator(slug);
  }
 }catch(e){message(e.message);}
}
logoutButton.onclick=async()=>{await client.auth.signOut();location.assign("./");};
init();
