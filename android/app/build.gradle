plugins {
    id 'com.android.application'
}

android {
    namespace 'com.foundationenglish.studentbook'
    compileSdk 35

    defaultConfig {
        applicationId 'com.foundationenglish.studentbook'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDirs += ["$buildDir/generated/book-assets"]
        main.res.srcDirs += ["$buildDir/generated/institute-brand-res"]
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.13.0'
}

// Bundle the proven static student book. No internet is needed for the
// pages, images, exercises, styling, quizzes, or the Arabic dictionary.
def prepareBookAssets = tasks.register('prepareBookAssets', Copy) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html', 'style.css'
        include 'audio/voice-manifest.json', 'audio/files/**'
    }
    into "$buildDir/generated/book-assets/web"
}
// Logos are exact scalable vector paths extracted from the user's Institute logo PDF.
// The original PDF's Arabic lettering has been preserved as outlines, not font text.
// Encoded text assets keep this repository and Gradle builds portable without a binary upload.
def decodeInstituteAsset = { String fileName ->
    def base64 = file("$rootDir/branding/$fileName").getText('UTF-8')
    byte[] compressed = java.util.Base64.getMimeDecoder().decode(base64)
    def source = new java.util.zip.GZIPInputStream(new java.io.ByteArrayInputStream(compressed))
    try { return source.bytes } finally { source.close() }
}
def prepareInstituteLogo = tasks.register('prepareInstituteLogo') {
    inputs.file("$rootDir/branding/full-institute-logo.svg.gz.b64")
    inputs.file("$rootDir/branding/launcher-icon.xml.gz.b64")
    outputs.file("$buildDir/generated/book-assets/web/logo.svg")
    outputs.file("$buildDir/generated/institute-brand-res/drawable/ic_institute_logo.xml")
    doLast {
        def webLogo = file("$buildDir/generated/book-assets/web/logo.svg")
        webLogo.parentFile.mkdirs()
        webLogo.bytes = decodeInstituteAsset('full-institute-logo.svg.gz.b64')
        def launcher = file("$buildDir/generated/institute-brand-res/drawable/ic_institute_logo.xml")
        launcher.parentFile.mkdirs()
        launcher.bytes = decodeInstituteAsset('launcher-icon.xml.gz.b64')
    }
}
tasks.named('preBuild').configure {
    dependsOn(prepareBookAssets)
    dependsOn(prepareInstituteLogo)
}

