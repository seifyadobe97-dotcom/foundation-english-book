<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="description" content="بوابة الطالب التفاعلية · STEP with Seify">
<title>بوابة الطالب | STEP with Seify</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#183441;--teal:#28786d;--gold:#caa579;--bg:#f4f7f5;--text:#273a42;--muted:#6a7e86;--line:#dfe8e4;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.9 Cairo,Tahoma,sans-serif;color:var(--text)}button,a{font:inherit}a{text-decoration:none;color:inherit}button{cursor:pointer}.header{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:15px max(18px,calc((100vw - 1180px)/2));gap:10px}.identity{display:flex;align-items:center;gap:12px}.seal{width:45px;height:45px;border-radius:12px;background:var(--navy);color:var(--gold);border:1px solid var(--gold);font:800 25px "DM Sans",sans-serif;display:grid;place-items:center}.identity strong{font:800 14px "DM Sans";letter-spacing:.1em;color:var(--navy)}.identity small{display:block;color:var(--muted);font-size:11px}.button{padding:10px 16px;background:var(--navy);color:white;border:0;border-radius:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:10px}.button.outline{background:#fff;color:var(--navy);border:1px solid #d2dfdb}.button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.header-tools{display:flex;gap:9px}.wrap{max-width:1210px;margin:auto;padding:34px 20px 70px}.eyebrow{font:800 12px "DM Sans",Arial;letter-spacing:.17em;color:var(--teal);direction:ltr;text-align:right}.hero{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:25px}.hero h1{font-size:clamp(27px,4vw,41px);line-height:1.4;margin:6px 0;color:var(--navy)}.hero p{color:var(--muted);margin:3px 0}.hero-symbol{font-size:44px;opacity:.25}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-bottom:22px}.metric{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}.metric strong{display:block;font:800 clamp(25px,3vw,35px) "DM Sans",sans-serif;color:var(--navy);direction:ltr;text-align:right}.metric span{font-size:13px;color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:14px}.section-head h2{font-size:24px;margin:20px 0 13px}.course-card{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:18px;border:1px solid var(--line);background:white;border-radius:18px;padding:26px;margin-bottom:25px;box-shadow:0 12px 33px #24483a08}.course-card h3{font-size:27px;margin:6px 0;color:var(--navy)}.course-card p{color:var(--muted);font-size:14px;margin:0 0 15px}.course-side{background:#eef5f1;border-radius:15px;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:25px;text-align:center}.course-side strong{font-size:32px;color:var(--teal);font-family:"DM Sans"}.bar{background:#e6eeeb;border-radius:99px;height:10px;overflow:hidden}.bar span{display:block;background:var(--teal);height:100%;border-radius:99px}.course-side .bar{background:white}.axis-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:22px}
.axis-card{border-radius:15px;padding:20px 17px;border:1px solid var(--line);background:white;min-height:194px;display:flex;flex-direction:column}
.axis-icon{font-size:28px}.axis-order{font:800 11px "DM Sans";letter-spacing:.08em;color:var(--teal);margin:10px 0 4px}
.axis-card h3{margin:0;font-size:18px;color:var(--navy)}.axis-card p{margin:0;font:600 12px "DM Sans";color:var(--muted);direction:ltr;text-align:right}
.axis-status{margin-top:auto;font-size:11px;font-weight:700;color:var(--green,var(--teal))}
@media(max-width:800px){.axis-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:440px){.axis-card{padding:14px;min-height:172px}.axis-card h3{font-size:15px}}
.lesson-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.lesson{background:white;border:1px solid var(--line);border-radius:13px;padding:18px}.lesson.locked{background:#f8faf9;color:#87928f}.lesson .num{display:inline-flex;font:800 12px "DM Sans";color:var(--teal);background:#edf5f2;padding:7px;border-radius:8px;margin-bottom:12px}.lesson h3{margin:0 0 5px;font-size:16px}.lesson p{color:var(--muted);font-size:12px;margin:0}.lesson small{font-size:12px;font-weight:800}.lesson .done{color:var(--teal)}.lesson .locked-icon{color:#97a4a0}.notice{border:1px solid #e8ddd1;background:#fff9f1;border-radius:11px;color:#765a34;padding:14px 18px;margin:15px 0}.lower{margin-top:30px;padding:18px;display:flex;justify-content:space-between;align-items:center;background:white;border:1px solid var(--line);border-radius:13px;gap:15px;flex-wrap:wrap}.lower a{font-weight:800;color:var(--teal)}.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:"DM Sans"}[hidden]{display:none!important}@media(max-width:730px){.metrics{grid-template-columns:repeat(3,minmax(0,1fr))}.metric{padding:13px}.course-card{grid-template-columns:1fr}.course-side{padding:15px}.lesson-grid{grid-template-columns:1fr 1fr}.header{padding:12px 14px}.header-tools .button{padding:8px 11px;font-size:12px}}@media(max-width:470px){.lesson-grid{grid-template-columns:1fr}.metrics{gap:7px}.metric strong{font-size:23px}.metric span{font-size:11px}.hero h1{font-size:27px}}
.student-followups{margin:24px 0}.task-count{font-size:12px;color:var(--teal);font-weight:800}.task-intro{color:var(--muted);margin:0 0 14px;font-size:13px}.task-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.student-task{background:#fff;border:1px solid #dbe8e2;border-radius:14px;padding:18px}.student-task.is-done{background:#f2faf4}.student-task h3{color:var(--navy);font-size:17px;margin:10px 0 5px}.student-task p{margin:5px 0;color:#4a6268;font-size:13px}.student-task small{color:var(--muted)}.task-meta{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;color:#207366;font-weight:800;font-size:11px}.task-meta span:last-child{background:#e8f4ee;border-radius:99px;padding:2px 10px}.task-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}.task-actions .button{font-size:12px;padding:8px 12px}.task-locked{color:var(--muted);font-size:12px}@media(max-width:620px){.task-grid{grid-template-columns:1fr}}
.study-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap.study-actions .button:first-child{background:#eaf5ee;color:#195f53;border:1px solid #c6e2d3}
.step-brand-image{display:block;width:206px;max-width:100%;height:auto;flex:none}@media(max-width:480px){.step-brand-image{width:158px}}</style>
<link rel="icon" type="image/svg+xml" href="../step-brand/mark.svg"></head><body>
<header class="header"><div class="identity"><img class="step-brand-image" src="../step-brand/logo.svg" alt="STEP with Seify" width="218" height="51"></div><div class="header-tools"><button id="refresh" class="button outline" hidden>تحديث</button><button id="signout" class="button outline" hidden>خروج</button></div></header>
<main id="app" class="wrap"><p>جاري تحميل بوابة الطالب…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
<script>
"use strict";
const config={"url":"https://funltjxavowlnnfibhpl.supabase.co","anonKey":"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1bmx0anhhdm93bG5uZmliaHBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MjYwODQsImV4cCI6MjEwODAwMjA4NH0.bvypJvBORTQ79Wf0yz5mLgKeFylDZtvf74uTvy4DWCg"};
const db=window.supabase.createClient(config.url,config.anonKey);
const app=document.getElementById("app");
const signout=document.getElementById("signout"),refresh=document.getElementById("refresh");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lessonUrl="../step-grammar-account-preview/";
async function course(){
 const {data:{session}}=await db.auth.getSession();
 if(!session){location.replace(lessonUrl);return;}
 const response=await fetch(config.url+"/functions/v1/step-course/course",{
  headers:{"Content-Type":"application/json","apikey":config.anonKey,"Authorization":"Bearer "+session.access_token}
 });
 const result=await response.json().catch(()=>({}));
 if(!response.ok)throw Error(result.error||"تعذر جلب بيانات الطالب");
 const catalogResponse=await fetch(config.url+"/functions/v1/step-course/catalog",{
  headers:{"Content-Type":"application/json","apikey":config.anonKey,"Authorization":"Bearer "+session.access_token}
 });
 const catalog=await catalogResponse.json().catch(()=>({}));
 if(!catalogResponse.ok)throw Error(catalog.error||"تعذر جلب محاور المنهج");
 const followupResponse=await fetch(config.url+"/functions/v1/step-course/followups",{
  headers:{"Content-Type":"application/json","apikey":config.anonKey,"Authorization":"Bearer "+session.access_token}
 });
 const followupData=await followupResponse.json().catch(()=>({}));
 return {...result,catalog,followups:followupResponse.ok?(followupData.followups||[]):[],
  followupError:followupResponse.ok?"":"تعذر تحميل خطة المتابعة؛ اضغط تحديث للمحاولة مرة تانية."};
}
const taskKind={review:"مراجعة الشرح",practice:"حل تدريب",video:"فيديو مع Seify"};
const taskStatus={pending:"بانتظار المراجعة",reviewed:"تمت المراجعة — منتظر التدريب",completed:"✓ تدريب ناجح بعد التكليف"};
function followupCards(x){
 const tasks=x.followups||[];
 if(!tasks.length&&!x.followupError)return "";
 return '<section class="student-followups"><div class="section-head"><h2>خطة متابعتي</h2><span class="task-count">'+
 tasks.filter(t=>t.status!=="completed").length+' تكليف مفتوح</span></div>'+
 (x.followupError?'<div class="notice">'+esc(x.followupError)+'</div>':'')+
 '<p class="task-intro">مراجعات محددة من المدرّس حسب احتياجك. إنجاز المتابعة بيتأكد لما تحل تدريب جديد بنجاح.</p>'+
 '<div class="task-grid">'+tasks.map(t=>'<article class="student-task '+(t.status==="completed"?"is-done":"")+'">'+
 '<div class="task-meta"><span>'+esc(taskKind[t.kind]||"متابعة")+'</span><span>'+
 esc(taskStatus[t.status]||"بانتظارك")+'</span></div>'+
 '<h3>'+esc(t.title)+'</h3>'+(t.note?'<p>'+esc(t.note)+'</p>':'')+
 (t.due_at?'<small>الموعد المستهدف: '+esc(new Date(t.due_at).toLocaleDateString("ar-SA"))+'</small>':'')+
 '<div class="task-actions">'+
 (t.accessible?'<a class="button" href="learn.html?step='+Number(t.part_index)+'">'+
 (t.kind==="video"?"شوف الفيديو والشرح":t.kind==="practice"?"حل تدريبات المهارة":"راجع المهارة")+' ←</a>':
 '<span class="task-locked">🔒 افتح المراحل السابقة الأول</span>')+
 (t.kind!=="practice"&&t.status==="pending"?'<button type="button" class="button outline" data-followup-review="'+
 esc(t.id)+'">راجعت المحتوى</button>':'')+'</div></article>').join("")+'</div></section>';
}
async function markFollowupReviewed(id,button){
 button.disabled=true;
 try{
  const {data:{session}}=await db.auth.getSession();
  if(!session){location.replace(lessonUrl);return;}
  const r=await fetch(config.url+"/functions/v1/step-course/followups/"+encodeURIComponent(id)+"/review",{
   method:"POST",headers:{"apikey":config.anonKey,"Authorization":"Bearer "+session.access_token,"Content-Type":"application/json"},
   body:"{}"});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw Error(j.error||"تعذر تسجيل المراجعة");
  await init();
 }catch(e){button.disabled=false;alert(e.message);}
}
function paint(x){
 signout.hidden=false;refresh.hidden=false;
 const sections=x.sections||[],passed=sections.filter(s=>s.passed).length;
 const percent=Math.round(passed/Math.max(1,sections.length)*100);
 const name=esc(x.student||"طالب STEP");
 const next=sections.find(s=>!s.locked&&!s.passed)||sections.at(-1);
 const exam=x.exam||{};
 const catalog=x.catalog||{};
 const names={reading:"📖",listening:"🎧",grammar:"✍️","writing-analysis":"📝"};
 const icons={"reading-comprehension":"📖",listening:"🎧",grammar:"✍️","writing-analysis":"📝"};
 const axes=Array.isArray(catalog.axes)?catalog.axes:[];
 const indicators=Array.isArray(catalog.indicators)?catalog.indicators:[];
 const axisHtml='<div class="section-head"><h2>محاور STEP الأربعة</h2></div><div class="axis-grid">'+
  axes.map(axis=>{
   const count=indicators.filter(i=>i.axis_code===axis.code).length;
   return '<div class="axis-card"><span class="axis-icon">'+(icons[axis.code]||"📚")+'</span><span class="axis-order">AXIS '+String(axis.position).padStart(2,"0")+'</span><h3>'+esc(axis.title_ar)+'</h3><p>'+esc(axis.title_en)+'</p><span class="axis-status">'+(count?count+' مؤشر متاح':'المحتوى قيد الإعداد')+'</span></div>';
  }).join("")+'</div>';
 app.innerHTML='<div class="hero"><div><div class="eyebrow">YOUR LEARNING SPACE</div><h1>أهلًا بيك، '+name+'</h1><p>كمّل من آخر خطوة وصلت لها، وخلّي تقدمك معاك في أي جهاز.</p></div><div class="hero-symbol">✦</div></div><div class="metrics"><div class="metric"><strong>'+passed+'/'+sections.length+'</strong><span>أجزاء مكتملة</span></div><div class="metric"><strong>'+percent+'%</strong><span>نسبة التقدم</span></div><div class="metric"><strong>'+(exam.best||0)+'%</strong><span>أفضل اختبار نهائي</span></div></div>'+followupCards(x)+axisHtml+'<div class="section-head"><h2>مؤشرات الجرامر</h2><span style="color:var(--muted);font-size:12px">COURSE LIBRARY</span></div><article class="course-card"><div><div class="eyebrow">GRAMMAR · INDICATOR 01</div><h3>Present Simple — المضارع البسيط</h3><p>'+esc(x.course?.subtitle||"")+'</p><div class="bar"><span style="width:'+percent+'%"></span></div><p style="margin-top:11px">'+passed+' من '+sections.length+' أجزاء منتهية</p><div class="study-actions"><a class="button" href="learn.html">'+(passed===sections.length?"راجع الدرس والاختبار":"ابدأ أو كمّل الدرس التفاعلي")+' ←</a></div></div><div class="course-side"><strong>'+percent+'%</strong><span>COURSE PROGRESS</span><div class="bar"><span style="width:'+percent+'%"></span></div><span>'+(exam.unlocked?"الاختبار النهائي متاح":"الاختبار النهائي بعد إكمال الأجزاء")+'</span></div></article><div class="section-head"><h2>خطوات الدرس</h2></div><section class="lesson-grid">'+sections.map(s=>'<div class="lesson '+(s.locked?"locked":"")+'"><span class="num">STEP '+String(s.index+1).padStart(2,"0")+'</span><h3>'+esc(s.titleAr)+'</h3><p>'+esc(s.short||s.title||"")+'</p><small class="'+(s.passed?"done":s.locked?"locked-icon":"")+'">'+(s.passed?"✓ تم اجتياز الجزء":s.locked?"🔒 مقفول":"← جاهز للمذاكرة")+'</small></div>').join("")+'</section><div class="lower"><span>عايز تستفسر عن الدراسة أو التسجيل؟</span><a href="https://wa.me/966544149974?text='+encodeURIComponent("السلام عليكم، عندي استفسار عن دراسة STEP Grammar بمنصة STEP with Seify.")+'" target="_blank" rel="noopener noreferrer">تواصل واتساب ↗</a></div>';
}
async function init(){
 try{const result=await course();if(result)paint(result);}
 catch(error){app.innerHTML='<div class="notice">'+esc(error.message||"تعذر تحميل بيانات حسابك")+'</div><button id="retry" class="button">إعادة المحاولة</button>';document.getElementById("retry").onclick=init;}
}
app.addEventListener("click",e=>{
 const button=e.target.closest("[data-followup-review]");
 if(button&&!button.disabled)markFollowupReviewed(button.dataset.followupReview,button);
});
signout.onclick=async()=>{await db.auth.signOut();location.replace(lessonUrl);};
refresh.onclick=init;
init();
</script></body></html>
