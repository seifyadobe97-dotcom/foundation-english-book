const app=document.getElementById("app");

const lessonUrl="../step-grammar-account-preview/";
async function course(){
 const {data:{session}}=await db.auth.getSession();
 if(!session){location.replace(lessonUrl);return;}
 const response=await fetch(config.url+"/functions/v1/step-course/course",{
  headers:{"Content-Type":"application/json","apikey":config.anonKey,"Authorization":"Bearer "+session.access_token},
  signal:AbortSignal.timeout(15000)
 });
 const result=await response.json().catch(()=>({}));
 if(!response.ok)throw Error(result.error||"تعذر جلب بيانات الطالب");
 const catalogResponse=await fetch(config.url+"/functions/v1/step-course/catalog",{
  headers:{"Content-Type":"application/json","apikey":config.anonKey,"Authorization":"Bearer "+session.access_token},
  signal:AbortSignal.timeout(15000)
 });
 const catalog=await catalogResponse.json().catch(()=>({}));
 if(!catalogResponse.ok)throw Error(catalog.error||"تعذر جلب محاور المنهج");
 // An optional teacher follow-up outage must never hide the actual lesson library.
 const followupResponse=await fetch(config.url+"/functions/v1/step-course/followups",{
  headers:{"Content-Type":"application/json","apikey":config.anonKey,"Authorization":"Bearer "+session.access_token},
  signal:AbortSignal.timeout(15000)
 }).catch(()=>null);
 const followupData=followupResponse?.ok?await followupResponse.json().catch(()=>({})):{};
 const agreementResponse=await fetch(config.url+"/functions/v1/step-course/agreement/course",{
  headers:{"Content-Type":"application/json","apikey":config.anonKey,"Authorization":"Bearer "+session.access_token},
  signal:AbortSignal.timeout(15000)
 }).catch(()=>null);
 const agreementData=agreementResponse?.ok?await agreementResponse.json().catch(()=>null):null;
 const continuousListed=(catalog.indicators||[]).some(i=>i.slug==="present-continuous");
 let continuousData=null;
 if(continuousListed){
  const r=await fetch(config.url+"/functions/v1/step-course/continuous/course",{
   headers:{"Content-Type":"application/json","apikey":config.anonKey,"Authorization":"Bearer "+session.access_token},
   signal:AbortSignal.timeout(15000)
  }).catch(()=>null);
  if(r?.ok)continuousData=await r.json().catch(()=>null);
 }
 const coreSlugs=new Set(["subject-verb-agreement","present-simple","present-continuous"]);
 const additional=(catalog.indicators||[]).filter(i=>["grammar","writing-analysis"].includes(i.axis_code)&&!coreSlugs.has(i.slug));
 // Only published, authenticated lessons become cards. Flag failed loads instead of
 // silently making an approved lesson look unpublished or reducing progress totals.
 // Keep slow connections understandable while published courses load in parallel.
 // The count covers authenticated lesson requests only; no protected content is cached.
 let completedLoads=0,loadStatus=null,loadBar=null,loadCount=null;
 if(additional.length){
  loadStatus=document.createElement("section");
  loadStatus.id="student-catalog-loading";
  loadStatus.setAttribute("role","status");
  loadStatus.setAttribute("aria-live","polite");
  loadStatus.innerHTML='<p>بنجهّز الدروس المنشورة… <strong></strong></p>'+
   '<progress aria-label="تحميل دروس المنهج" max="'+additional.length+'" value="0"></progress>';
  loadBar=loadStatus.querySelector("progress");
  loadCount=loadStatus.querySelector("strong");
  loadCount.textContent="0 من "+additional.length;
  app.replaceChildren(loadStatus);
 }
 const extraResults=await Promise.all(additional.map(async indicator=>{
  try{
   if(!/^[a-z][a-z0-9-]{2,39}$/.test(indicator.slug))return {unavailable:true};
   const response=await fetch(config.url+"/functions/v1/step-course/lesson/"+indicator.slug+"/course",{
    headers:{"Content-Type":"application/json","apikey":config.anonKey,"Authorization":"Bearer "+session.access_token},
    signal:AbortSignal.timeout(15000)
   }).catch(()=>null);
   if(!response?.ok)return {unavailable:true};
   const value=await response.json().catch(()=>null);
   return value&&Array.isArray(value.sections)?{slug:indicator.slug,data:value}:{unavailable:true};
  }finally{
   completedLoads++;
   if(loadBar)loadBar.value=completedLoads;
   if(loadCount&&(completedLoads%5===0||completedLoads===additional.length))
    loadCount.textContent=completedLoads+" من "+additional.length;
  }
 }));
 const unavailableLessons=extraResults.filter(entry=>entry?.unavailable).length+
  (catalog.indicators||[]).filter(i=>i.slug==="subject-verb-agreement").length*(agreementData?0:1)+
  (continuousListed&&!continuousData?1:0);
 return {...result,catalog,agreement:agreementData,continuous:continuousData,
  extraLessons:extraResults.filter(entry=>entry?.data),unavailableLessons,
  followups:followupResponse?.ok?(followupData.followups||[]):[],
  followupError:followupResponse?.ok?"":"تعذر تحميل خطة المتابعة؛ اضغط تحديث للمحاولة مرة تانية."};
}
const taskKind={review:"مراجعة الشرح",practice:"حل تدريب",video:"فيديو مع Seify"};

 if(!tasks.length&&!x.followupError)return "";
 return '<section class="student-followups"><div class="section-head"><h2>خطة متابعتي</h2><span class="task-count">'+
 tasks.filter(t=>t.status!=="completed").length+' تكليف مفتوح</span></div>'+
 (x.followupError?'<div class="notice">'+esc(x.followupError)+'</div>':'')+
 '<p class="task-intro">مراجعات محددة من المدرّس حسب احتياجك. إنجاز المتابعة بيتأكد لما تحل تدريب جديد بنجاح.</p>'+
 '<div class="task-grid">'+tasks.map(t=>'<article class="student-task '+(t.status==="completed"?"is-done":"")+'">'+
 '<div class="task-meta"><span>'+esc(taskKind[t.kind]||"متابعة")+'</span><span>'+
 esc(taskStatus[t.status]||"بانتظارك")+'</span></div>'+
 '<h3>'+esc(t.title)+'</h3>'+(t.note?'<p>'+esc(t.note)+'</p>':'')+
 (t.due_at?'<small>الموعد المستهدف: '+esc(new Date(t.due_at).toLocaleDateString("ar-SA"))+'</small>':'')+
 '<div class="task-actions">'+
 (t.accessible?'<a class="button" href="learn.html?step='+Number(t.part_index)+'">'+

 '<span class="task-locked">🔒 افتح المراحل السابقة الأول</span>')+
 (t.kind!=="practice"&&t.status==="pending"?'<button type="button" class="button outline" data-followup-review="'+
 esc(t.id)+'">راجعت المحتوى</button>':'')+'</div></article>').join("")+'</div></section>';

 const names={reading:"📖",listening:"🎧",grammar:"✍️","writing-analysis":"📝"};

 const axes=Array.isArray(catalog.axes)?catalog.axes:[];
 const indicators=Array.isArray(catalog.indicators)?catalog.indicators:[];
 const agreement=x.agreement,agreementListed=indicators.some(i=>i.slug==="subject-verb-agreement");
 const agreementSections=agreement?.sections||[],agreementPassed=agreementSections.filter(i=>i.passed).length;

  '<span>'+(agreement.exam?.unlocked?'الاختبار متاح':'الاختبار بعد المراحل')+'</span></div></article>':'';
 const continuousCard=continuousListed&&continuous?'<article class="course-card"><div>'+

   return '<button type="button" class="axis-card" data-axis-code="'+esc(axis.code)+'" aria-label="محور '+esc(axis.title_ar)+'"><span class="axis-icon">'+(icons[axis.code]||"📚")+'</span><span class="axis-order">AXIS '+String(axis.position).padStart(2,"0")+'</span><h3>'+esc(axis.title_ar)+'</h3><p>'+esc(axis.title_en)+'</p><span class="axis-status">'+(count?count+' درس منشور':'المحتوى قيد الإعداد')+'</span></button>';
  }).join("")+'</div>';
 app.innerHTML='<div class="hero"><div><div class="eyebrow">YOUR LEARNING SPACE</div><h1>أهلًا بيك، '+name+'</h1><p>كمّل من آخر خطوة وصلت لها، وخلّي تقدمك معاك في أي جهاز.</p></div><div class="hero-symbol">✦</div></div><div class="metrics"><div class="metric"><strong>'+completedLearningStages+'/'+totalLearningStages+'</strong><span>مراحل مكتملة في الدروس</span></div><div class="metric"><strong>'+overallPercent+'%</strong><span>التقدم في الدروس</span></div><div class="metric"><strong>'+(exam.best||0)+'%</strong><span>أفضل اختبار للدرس 2</span></div></div>'+followupCards(x)+axisHtml+'<p id="axis-feedback" role="status" aria-live="polite" hidden></p><div class="section-head" id="grammar-lessons"><h2>مؤشرات الجرامر</h2><span style="color:var(--muted);font-size:12px">COURSE LIBRARY</span></div>'+agreementCard+'<article class="course-card"><div><div class="eyebrow">GRAMMAR · INDICATOR 02</div><h3>'+esc(x.course?.title||"Present Simple")+' — '+esc(x.course?.titleAr||"المضارع البسيط")+'</h3><p>'+esc(x.course?.subtitle||"")+'</p><div class="bar"><span style="width:'+percent+'%"></span></div><p style="margin-top:11px">'+passed+' من '+sections.length+' أجزاء منتهية</p><div class="study-actions"><a class="button" href="learn.html">'+(passed===sections.length?"راجع الدرس والاختبار":"ابدأ أو كمّل الدرس التفاعلي")+' ←</a></div></div><div class="course-side"><strong>'+percent+'%</strong><span>LESSON 02 PROGRESS</span><div class="bar"><span style="width:'+percent+'%"></span></div><span>'+(exam.unlocked?"الاختبار النهائي متاح":"الاختبار النهائي بعد إكمال الأجزاء")+'</span></div></article>'+continuousCard+'<div class="section-head"><h2>مراحل الدرس 2 — المضارع البسيط</h2></div><section class="lesson-grid">'+sections.map(s=>'<div class="lesson '+(s.locked?"locked":"")+'"><span class="num">STEP '+String(s.index+1).padStart(2,"0")+'</span><h3>'+esc(s.titleAr)+'</h3><p>'+esc(s.short||s.title||"")+'</p><small class="'+(s.passed?"done":s.locked?"locked-icon":"")+'">'+(s.passed?"✓ تم اجتياز الجزء":s.locked?"🔒 مقفول":"← جاهز للمذاكرة")+'</small></div>').join("")+'</section><div class="lower"><span>عايز تستفسر عن الدراسة أو التسجيل؟</span><a href="https://wa.me/966544149974?text='+encodeURIComponent("السلام عليكم، عندي استفسار عن دراسة STEP Grammar بمنصة STEP with Seify.")+'" target="_blank" rel="noopener noreferrer">تواصل واتساب ↗</a></div>';
 // Partial API failures are visible and retryable; no unpublished or denied lesson is linked.
 if(x.unavailableLessons){
  const warning=document.createElement("div");
  warning.id="student-lessons-load-warning";
  warning.className="notice";
  warning.setAttribute("role","alert");
  warning.innerHTML='<strong>في '+Number(x.unavailableLessons)+' درس منشور مش قادرين نحمّله دلوقتي.</strong> '+
   'باقي الدروس ظاهرة عادي، وأرقام التقدم المعروضة تخص الدروس اللي اتحملت فقط. '+
   '<button type="button" class="button outline">إعادة تحميل الدروس</button>';
  app.querySelector(".metrics")?.insertAdjacentElement("afterend",warning);
  warning.querySelector("button").addEventListener("click",init);
 }
 app.querySelectorAll("[data-axis-code]").forEach(button=>button.addEventListener("click",()=>{
  const axis=button.dataset.axisCode,feedback=app.querySelector("#axis-feedback");
  if(axis==="grammar"){
   feedback.hidden=true;app.querySelector("#grammar-lessons")?.scrollIntoView({behavior:"smooth",block:"start"});
  }else if(axis==="writing-analysis"&&app.querySelector("#writing-analysis-lessons")){
   feedback.hidden=true;app.querySelector("#writing-analysis-lessons").scrollIntoView({behavior:"smooth",block:"start"});
  }else{
   const name=axes.find(a=>a.code===axis)?.title_ar||"المحور";
   feedback.textContent="محور "+name+" قيد تجهيز المحتوى واعتماده؛ مش هنظهر تدريبات غير منشورة.";
   feedback.hidden=false;feedback.scrollIntoView({behavior:"smooth",block:"nearest"});
  }
 }));
 if(window.StepStudentExperience)window.StepStudentExperience.enhance(app,x,esc);
}
async function init(){
 try{const result=await course();if(result)paint(result);}
 catch(error){
  const networkFailure=["TypeError","AbortError","TimeoutError"].includes(error?.name);
  const message=networkFailure?"الاتصال اتقطع أو التحميل اتأخر. اتأكد من الإنترنت واضغط إعادة المحاولة.":
   error.message||"تعذر تحميل بيانات حسابك";
  app.innerHTML='<div class="notice" role="alert">'+esc(message)+'</div>'+
   '<button id="retry" class="button" type="button">إعادة المحاولة</button>';
  document.getElementById("retry").onclick=init;
 }
}
app.addEventListener("click",e=>{
 const button=e.target.closest("[data-followup-review]");
 if(button&&!button.disabled)markFollowupReviewed(button.dataset.followupReview,button);
});
signout.onclick=async()=>{await db.auth.signOut();location.replace(lessonUrl);};
refresh.onclick=init;
init();
