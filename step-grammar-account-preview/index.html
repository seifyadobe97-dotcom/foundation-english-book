 body:opts.body
 });
 const result=await response.json().catch(()=>({error:"مشكلة في الاتصال بالخادم."}));
 if(!response.ok)throw Error(result.error||"تعذر إكمال العملية.");
 return result;
}
const stepWhatsappContactNumber = "966544149974"; // Institute WhatsApp number, international digits without plus sign.
function whatsAppContactHtml(){
 const digits=stepWhatsappContactNumber.replace(/\D/g,"");
 if(!/^[1-9][0-9]{7,14}$/.test(digits))return "";
 const message=encodeURIComponent("السلام عليكم، عندي استفسار عن التسجيل في كتاب STEP Grammar بمعهد القدرات للتدريب.");
 const url="https://wa.me/"+digits+"?text="+message;
 return '<a class="wa-contact-btn" href="'+url+'" target="_blank" rel="noopener noreferrer" aria-label="تواصل واتساب مع المعهد"><span class="wa-icon" aria-hidden="true">✆</span><span>تواصل معنا عبر واتساب</span> ↗</a>';
}
function normalizeContactPhone(value){
 const latin=String(value||"").trim().replace(/[٠-٩]/g,c=>String(c.charCodeAt(0)-1632)).replace(/[۰-۹]/g,c=>String(c.charCodeAt(0)-1776));
 return latin.replace(/[\s().-]/g,"");
}
function loginPage(message="",mode="login"){
 const signup=mode==="signup";
 app.innerHTML=header(false)+'<main class="login-grid"><section class="login-art"><div class="login-art-inner"><div class="eyebrow">STEP GRAMMAR MASTERY</div><h1>قواعد الإنجليزي.<br>أسهل من اللي تتخيله.</h1><p>افهم كل جزء، حل الأسئلة، واحتفظ بدرجاتك على حسابك الشخصي.</p></div><div class="login-facts"><div><strong>01</strong><span>درس تجريبي</span></div><div><strong>06</strong><span>أجزاء تعليمية</span></div><div><strong>19</strong><span>سؤالًا</span></div></div></section><section class="login-form-wrap"><form id="account-form" class="login-card"><div class="mini-divider"></div><div class="eyebrow">STUDENT ACCOUNT</div><h2>'+(signup?'إنشاء حساب جديد':'أهلًا بيك تاني')+'</h2><p class="lead">'+(signup?'اختار اسم مستخدم وكلمة مرور وادخل بريدك الإلكتروني.':'ادخل ببيانات حسابك علشان تكمل من آخر جزء وصلت له.')+'</p><div class="field"><label for="username">اسم المستخدم</label><input id="username" required autocomplete="username" minlength="3" maxlength="24" pattern="[A-Za-z][A-Za-z0-9_]{2,23}" placeholder="studentname" dir="ltr"></div>'+(signup?'<div class="field"><label for="email">البريد الإلكتروني</label><input id="email" required type="email" autocomplete="email" placeholder="student@example.com" dir="ltr"></div>':'')+(signup?'<div class="field"><label for="phone">رقم الموبايل</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" required maxlength="24" dir="ltr"></div>':'')+'<div class="field"><label for="password">كلمة المرور</label><input id="password" required minlength="10" type="password" autocomplete="'+(signup?'new-password':'current-password')+'" placeholder="10 characters or more" dir="ltr"></div>'+(message?'<div class="error-box">'+escapeHtml(message)+'</div>':'')+'<button class="btn btn-primary btn-full" type="submit">'+(signup?'إنشاء الحساب':'تسجيل الدخول')+'</button><button class="btn btn-outline btn-full" type="button" id="switch-mode" style="margin-top:12px">'+(signup?'لديك حساب بالفعل؟ سجل دخولك':'ما عندكش حساب؟ أنشئ حساب جديد')+'</button>'+whatsAppContactHtml()+'</form></section></main>';
 const iti=signup&&window.intlTelInput?window.intlTelInput(document.getElementById("phone"),{
 initialCountry:"sa",separateDialCode:true,
 countryOrder:["sa","ae","eg","kw","bh","qa","om","jo","ye"],
 loadUtils:()=>import("https://cdn.jsdelivr.net/npm/intl-tel-input@29.5.5/dist/js/utils.js")
 }):null;
 document.getElementById("switch-mode").onclick=()=>loginPage("",signup?"login":"signup");
 document.getElementById("account-form").onsubmit=async (event)=>{
 event.preventDefault();
 const btn=event.target.querySelector('button[type="submit"]');btn.disabled=true;btn.textContent="جاري التنفيذ…";
 const username=document.getElementById("username").value.trim().toLowerCase(),password=document.getElementById("password").value;
 try{
  if(signup){
    const email=document.getElementById("email").value.trim();
    if(!iti)throw Error("تعذر تحميل قائمة الدول. حدّث الصفحة وحاول مجددًا.");
    await iti.promise;
    if(!iti.isValidNumber())throw Error("تأكد من رقم الموبايل والدولة المختارة.");
    const phone_e164=iti.getNumber();
    if(!/^\+[1-9][0-9]{7,14}$/.test(phone_e164))throw Error("رقم الموبايل غير صحيح.");
    const r=await cloudClient.auth.signUp({email,password,options:{data:{username,phone_e164,app_target:"step-grammar"},emailRedirectTo:location.origin+location.pathname}});
    if(r.error)throw r.error;
    if(r.data.session){state.username=username;await refreshCourse(true);}
    else loginPage("تم إرسال رسالة تأكيد إلى بريدك. بعد التأكيد سجّل دخولك باسم المستخدم.","login");
  }else{
    const r=await fetch(config.url+"/functions/v1/username-login",{method:"POST",headers:{"Content-Type":"application/json","apikey":config.anonKey},body:JSON.stringify({username,password})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw Error(j.error||"فشل تسجيل الدخول.");
    const result=await cloudClient.auth.setSession({access_token:j.access_token,refresh_token:j.refresh_token});
    if(result.error)throw result.error;
    state.username=username;await refreshCourse(true);
  }
 }catch(error){loginPage(error.message||"تعذر التسجيل. حاول مرة تانية.",mode);}
 };
}

async function refreshCourse(initial=false){const d=await api('/course');state.course=d;state.username=d.student;if(initial||state.active>d.nextIndex)state.active=d.nextIndex;await openPart(state.active,false);}
async function openPart(index,scroll=true){try{const d=await api('/parts/'+index);state.active=index;state.part=d.part;state.answers={};state.feedback=null;state.view='course';state.examQuestions=null;state.examResult=null;renderCourse();if(scroll)window.scrollTo({top:0,behavior:'smooth'});}catch(e){toast(e.message);}}
function stepNav(c){return `<aside class="right-menu"><div class="menu-label">COURSE NAVIGATION</div><h3 class="menu-title">خطة الدرس</h3><p class="menu-caption">لازم تنجح في كل جزء علشان تفتح اللي بعده.</p><nav class="part-menu">${c.sections.map(s=>`<button class="part-nav ${s.index===state.active?'active':''} ${s.passed?'passed':''} ${s.locked?'locked':''}" data-go="${s.index}" ${s.locked?'disabled':''} aria-label="${escapeHtml(s.titleAr)}${s.locked?' (مقفول)':''}"><span class="nav-num">${s.passed?'✓':String(s.index+1).padStart(2,'0')}</span><span class="nav-name">${escapeHtml(s.titleAr)}</span><span class="nav-icon">${s.locked?'⌑':s.index===state.active?'←':''}</span></button>`).join('')}</nav><div class="menu-bottom"><bdi>ASGQPRSIM</bdi><p>كل خطوة تفتح اللي بعدها. تقدّمك محفوظ في حسابك.</p></div></aside>`;}
function mobileNav(c){return `<div class="mobile-steps">${c.sections.map(s=>`<button class="step-pill ${s.index===state.active?'active':''} ${s.passed?'passed':''} ${s.locked?'locked':''}" data-go="${s.index}" ${s.locked?'disabled':''} aria-label="الجزء ${s.index+1}: ${escapeHtml(s.titleAr)}">${s.passed?'✓':String(s.index+1).padStart(2,'0')}${s.locked?' ·':''}</button>`).join('')}</div>`;}
function formula(tokens){return `<div class="formula" dir="ltr">${tokens.map(token=>`<span class="rule-token ${token==='+'||token==='؟'||token==='?'?'symbol':''}">${escapeHtml(token)}</span>`).join('')}</div>`;}
function lessonContent(p){return `<section class="part-hero"><div class="part-banner"><div><div class="part-tag">${escapeHtml(p.tag)}</div><h2>${escapeHtml(p.titleAr)}</h2><p>${escapeHtml(p.subtitle)}</p></div><div class="duration-pill">◷ ${escapeHtml(p.duration)}</div></div><div class="lesson-padded"><div class="section-eyebrow">LET'S UNDERSTAND</div><h3 class="content-heading">افهمها ببساطة</h3><p class="concept-text">${inline(p.description)}</p><div class="rule-panel">${formula(p.rule)}${p.alternativeRule?`<div class="alt-formula">${formula(p.alternativeRule)}</div>`:''}</div><div class="tiles">${p.tiles.map(tile=>`<div class="tile"><em>${escapeHtml(tile.label)}</em><strong>${escapeHtml(tile.text)}</strong></div>`).join('')}</div><div class="gold-card"><div class="gold-symbol">★</div><div><h4>${escapeHtml(p.gold.title)}</h4><p>${inline(p.gold.body)}</p></div></div><hr class="section-divider"><div class="section-eyebrow">SEE IT IN ACTION</div><h3 class="content-heading">أمثلة سريعة</h3><div class="example-group">${p.examples.map(ex=>`<div class="example"><span class="english">${escapeHtml(ex.en)}</span><span class="translation">${escapeHtml(ex.ar)}</span></div>`).join('')}</div><hr class="section-divider"><div class="section-eyebrow">AVOID THE TRAP</div><h3 class="content-heading">خد بالك من الغلطة دي</h3><div class="mistake-card"><div class="mistake-sample"><span class="mistake-label">✕ غلط</span><span class="english">${escapeHtml(p.mistake.wrong)}</span></div><div class="mistake-sample"><span class="mistake-label">✓ صح</span><span class="english">${escapeHtml(p.mistake.right)}</span></div></div><p class="mistake-help">${escapeHtml(p.mistake.why)}</p></div></section>`;}
function questionHtml(q,index,feedback){const f=feedback?.results?.find(x=>x.id===q.id);const choices=Object.entries(q.options);return `<section class="question-card" data-question="${escapeHtml(q.id)}"><div class="question-num">QUESTION ${String(index+1).padStart(2,'0')}</div><div class="question-text" dir="ltr">${escapeHtml(q.text)}</div><div class="options">${choices.map(([k,val])=>`<button type="button" data-answer="${escapeHtml(q.id)}" data-choice="${k}" class="option ${state.answers[q.id]===k?'selected':''} ${f&&f.correct===k?'correct':''} ${f&&f.selected===k&&!f.isCorrect?'wrong':''}" ${feedback?'disabled':''}><span class="option-letter">${k}</span><span class="option-text">${escapeHtml(val)}</span></button>`).join('')}</div>${f?`<div class="answer-feedback ${f.isCorrect?'':'wrong'}"><b>${f.isCorrect?'✓ إجابة صحيحة':'الإجابة الصحيحة: '+escapeHtml(f.correct)}</b><div>${inline(f.explanation)}</div></div>`:''}</section>`;}
function practiceSection(p){const feedback=state.feedback;return `<div class="practice-header"><div><div class="section-eyebrow">TIME TO PRACTICE</div><h2>جرّب تحل بنفسك</h2><p>جاوب الأسئلة الأول، وبعدها شوف الإجابات والشرح.</p></div><div class="practice-required">للنجاح: ${p.passRequired} من ${p.questions.length}</div></div>${feedback?`<div class="summary-result ${feedback.passed?'':'fail'}"><h3>${feedback.passed?'أحسنت! الجزء ده اتقفل بنجاح.':'محتاج محاولة كمان'}</h3><p>جاوبت صح على <strong>${feedback.correctCount} / ${feedback.total}</strong>. ${feedback.passed?'تقدر تنتقل للجزء التالي.':'راجع شرح الإجابات وحاول مرة تانية. مفيش حد أقصى للمحاولات.'}</p></div>`:''}${p.questions.map((q,i)=>questionHtml(q,i,feedback)).join('')}<div class="practice-bottom"><div class="practice-hint">${feedback?'اضغط «حاول من جديد» أو انتقل للجزء التالي.':'التصحيح هيظهر بعد إجابة كل الأسئلة.'}</div>${feedback?(feedback.passed?`<button class="btn btn-primary" id="continue">${state.active===state.course.sections.length-1?'افتح اختبار نهاية الدرس':'انتقل للجزء التالي ←'}</button>`:`<button class="btn btn-primary" id="retry">حاول من جديد ↻</button>`):`<button class="btn btn-primary" id="check" disabled>صحّح إجاباتي ←</button>`}</div>`;}
function examPromo(c){return `<aside class="exam-promo"><div><div class="eyebrow">FINAL ASSESSMENT</div><h3>${c.completed?'جاهز للاختبار النهائي!':'اختبار نهاية الدرس'}</h3><p>${c.completed?'10 أسئلة ونتيجة فورية، بعد ما خلصت كل أجزاء الشرح.':`هيتفتح بعد نجاحك في الأجزاء الستة. باقي ${c.sections.filter(x=>!x.passed).length} جزء.`}</p></div><button id="exam-btn" class="btn" ${c.completed?'':'disabled'}>${c.completed?'ابدأ الاختبار ←':'الاختبار مقفول'}</button></aside>`;}
function renderCourse(){const c=state.course,p=state.part;if(!p||!c)return;const passed=c.sections.filter(s=>s.passed).length;const pct=Math.round(passed/c.sections.length*100);app.innerHTML=header(true)+`<div class="student-layout">${stepNav(c)}<main class="main-work">${mobileNav(c)}<div class="main-width"><div class="crumbs"><span>منهج STEP Grammar</span><span class="dot">•</span><span>الأزمنة</span><span class="dot">•</span><span>المضارع البسيط</span></div><div class="course-heading"><div><div class="eyebrow">LESSON 01 / TENSES</div><h1>Present Simple</h1><p>المضارع البسيط · شرح بسيط وتطبيق بعد كل خطوة</p></div><div class="course-code">ASGQPRSIM</div></div><div class="progress-card"><div><h3>تقدّمك في الدرس</h3><p>${passed} من ${c.sections.length} أجزاء مكتملة</p></div><div class="meter" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div class="meter-fill" style="width:${pct}%"></div></div></div>${lessonContent(p)}${practiceSection(p)}${examPromo(c)}<div class="footer-copy">QUDRAT TRAINING INSTITUTE · STEP GRAMMAR MASTERY</div></div></main></div>`;
 document.getElementById('logout').onclick=logout;
 document.querySelectorAll('[data-go]').forEach(x=>x.addEventListener('click',()=>openPart(Number(x.dataset.go))));
 document.querySelectorAll('[data-answer]').forEach(x=>x.addEventListener('click',()=>{state.answers[x.dataset.answer]=x.dataset.choice;const qid=x.dataset.answer;document.querySelectorAll('[data-answer="'+CSS.escape(qid)+'"]').forEach(el=>el.classList.toggle('selected',el.dataset.choice===state.answers[qid]));const check=document.getElementById('check');if(check)check.disabled=p.questions.some(q=>!state.answers[q.id]);}));
 const check=document.getElementById('check');if(check)check.onclick=async()=>{check.disabled=true;check.textContent='جاري التصحيح…';try{state.feedback=await api('/parts/'+state.active+'/submit',{method:'POST',body:JSON.stringify({answers:state.answers})});state.course=state.feedback.progress;renderCourse();document.querySelector('.practice-header')?.scrollIntoView({behavior:'smooth',block:'start'});}catch(e){toast(e.message);check.disabled=false;check.textContent='صحّح إجاباتي ←';}};
 const retry=document.getElementById('retry');if(retry)retry.onclick=()=>{state.feedback=null;state.answers={};renderCourse();document.querySelector('.practice-header')?.scrollIntoView({behavior:'smooth'});};
 const next=document.getElementById('continue');if(next)next.onclick=()=>{if(state.course.completed&&state.active===state.course.sections.length-1)loadExam();else openPart(Math.min(state.active+1,state.course.sections.length-1));};
 const exam=document.getElementById('exam-btn');if(exam&&!exam.disabled)exam.onclick=loadExam;
}
async function logout(){await cloudClient.auth.signOut();location.reload();}

async function loadExam(){try{const d=await api('/exam');state.examQuestions=d.questions;state.examAnswers={};state.examResult=null;state.view='exam';renderExam();window.scrollTo(0,0);}catch(e){toast(e.message);}}
function renderExam(){const qs=state.examQuestions;app.innerHTML=header(true)+`<main class="main-work exam-shell"><div class="crumbs">Present Simple <span class="dot">•</span> الاختبار النهائي</div><div class="exam-intro"><div class="eyebrow">FINAL ASSESSMENT</div><h2>اختبار المضارع البسيط</h2><p>10 أسئلة. جاوب عن كل سؤال وبعدها اعرف نتيجتك وراجع أخطاءك.</p></div>${qs.map((q,i)=>questionHtml(q,i,null)).join('')}<div class="practice-bottom"><p class="practice-hint">التصحيح بيظهر بعد تسليم الاختبار كاملًا.</p><button class="btn btn-primary" id="submit-exam" disabled>سلّم الاختبار ←</button></div><button class="btn btn-outline btn-small" id="back-course" style="margin-top:20px">العودة للدرس</button></main>`;
 document.getElementById('logout').onclick=logout;
 document.getElementById('back-course').onclick=()=>openPart(state.active);
 document.querySelectorAll('[data-answer]').forEach(x=>x.addEventListener('click',()=>{state.examAnswers[x.dataset.answer]=x.dataset.choice;const qid=x.dataset.answer;document.querySelectorAll('[data-answer="'+CSS.escape(qid)+'"]').forEach(el=>el.classList.toggle('selected',el.dataset.choice===state.examAnswers[qid]));document.getElementById('submit-exam').disabled=qs.some(q=>!state.examAnswers[q.id]);}));
 document.getElementById('submit-exam').onclick=async()=>{try{const r=await api('/exam/submit',{method:'POST',body:JSON.stringify({answers:state.examAnswers})});state.examResult=r;state.course=r.progress;renderExamResult();window.scrollTo(0,0);}catch(e){toast(e.message);}};
}
function renderExamResult(){const data=state.examResult,r=data.result;app.innerHTML=header(true)+`<main class="main-work exam-shell"><div class="exam-result"><div class="eyebrow">YOUR RESULT</div><div class="score-big">${r.percentage}%</div><h1>نتيجتك: ${r.score} من ${r.total}</h1><p>النتيجة محفوظة في حسابك. راجع الإجابات اللي محتاج تفهمها، وتقدر تختبر نفسك مرة تانية.</p><hr class="section-divider"><h2>مراجعة الأسئلة</h2>${data.results.map((x,i)=>`<div class="exam-review"><span class="eng">${i+1}. ${escapeHtml(x.text)}</span><b style="color:${x.isCorrect?'#278269':'#a34b4a'}">${x.isCorrect?'✓ صحيح':'✕ يحتاج مراجعة'}</b> · الاختيار الصحيح <b>${escapeHtml(x.correct)}</b><p>${inline(x.explanation)}</p></div>`).join('')}<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:23px"><button id="retry-exam" class="btn btn-primary">اختبار جديد</button><button id="back-course" class="btn btn-outline">العودة للدرس</button></div></div></main>`;document.getElementById('logout').onclick=logout;document.getElementById('retry-exam').onclick=loadExam;document.getElementById('back-course').onclick=()=>openPart(state.active);}
async function init(){try{const {data:{session}}=await cloudClient.auth.getSession();if(!session){loginPage();return;}await refreshCourse(true);}catch(error){console.error(error);loginPage("تعذر فتح بيانات الحساب. حاول مرة تانية.");}}
init();
</script>
